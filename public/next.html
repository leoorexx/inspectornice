<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inspector Nice — Stadt-Signatur</title>
<meta name="description" content="Ein verschmolzenes Bild von Klima, Umwelt und sozialer Lage — jeder Ort mit eigener Signatur.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ink:#14141f;--ink2:#3b3b4f;--mute:#6e6e82;--line:rgba(20,20,31,.09);--line2:rgba(20,20,31,.16);
  --bg:#f4f2ec;--glass:rgba(255,255,255,.82);--card:#ffffff;--soft:#f6f5f1;
  --accent:#FFD600;--chrome:#14141f;
  --sh:0 1px 2px rgba(20,20,31,.06),0 8px 28px rgba(20,20,31,.10);
  --sh2:0 2px 6px rgba(20,20,31,.08),0 24px 60px rgba(20,20,31,.18);
  --r:18px;--r2:12px;--ease:cubic-bezier(.22,1,.36,1);
  --serif:'Fraunces',Georgia,serif;--sans:'Archivo',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f2f1ec;--ink2:#cfcfd8;--mute:#9a9aae;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --bg:#101018;--glass:rgba(24,24,34,.82);--card:#1b1b26;--soft:#22222e;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.4);--sh2:0 24px 60px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--ink:#f2f1ec;--ink2:#cfcfd8;--mute:#9a9aae;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --bg:#101018;--glass:rgba(24,24,34,.82);--card:#1b1b26;--soft:#22222e;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.4);--sh2:0 24px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-tile-pane{filter:saturate(.6) contrast(.95) brightness(1.03)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.4)}}
.leaflet-control-attribution{background:var(--glass)!important;backdrop-filter:blur(8px);color:var(--mute)!important;font-size:10px;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-control-zoom{border:none!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--glass)!important;backdrop-filter:blur(12px);color:var(--ink)!important;border-color:var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}

/* ── Kopf ── */
.top{position:fixed;top:14px;left:14px;right:14px;z-index:1000;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;background:var(--chrome);color:#fff;border-radius:14px;padding:9px 14px 9px 11px;box-shadow:var(--sh);text-decoration:none;flex:none}
.brand svg{flex:none}
.brand b{font-weight:800;font-size:14px;letter-spacing:-.01em}
.brand small{display:block;font-size:10px;color:rgba(255,255,255,.55);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh);padding:0 16px 0 44px;font:500 15px var(--sans);color:var(--ink);outline:none;transition:box-shadow .2s var(--ease),border-color .2s}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--accent);box-shadow:var(--sh2)}
.search .ic{position:absolute;left:15px;top:14px;color:var(--mute);pointer-events:none}
.sugg{position:absolute;top:52px;left:0;right:0;background:var(--card);border-radius:14px;box-shadow:var(--sh2);overflow:hidden;display:none;border:1px solid var(--line)}
.sugg.on{display:block;animation:pop .18s var(--ease)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:none}
.sugg button:hover,.sugg button.act{background:var(--soft)}
.sugg small{color:var(--mute);font-size:11px;margin-left:auto;text-transform:uppercase;letter-spacing:.05em}
.tools{display:flex;gap:6px;margin-left:auto;flex:none}
.tbtn{height:46px;min-width:46px;padding:0 13px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh);font:700 12px var(--sans);display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);text-decoration:none;transition:transform .15s var(--ease)}
.tbtn:hover{transform:translateY(-1px)}
.lang{display:flex;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:4px;height:46px}
.lang button{border:none;background:none;border-radius:10px;padding:0 11px;font:800 12px var(--sans);color:var(--mute)}
.lang button.on{background:var(--chrome);color:var(--accent)}

/* ── Linsen ── */
.lenses{position:fixed;left:14px;top:72px;z-index:1000;transition:max-width .45s var(--ease);display:flex;gap:4px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:5px;max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
body.panel-on .lenses{max-width:calc(100vw - 456px)}
.lenses::-webkit-scrollbar{display:none}
.lens{flex:none;border:none;background:none;border-radius:13px;padding:9px 13px;font:700 13px var(--sans);color:var(--ink2);display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s var(--ease),color .2s}
.lens:hover{background:var(--soft)}
.lens.on{background:var(--chrome);color:#fff}
.lens.on svg{color:var(--accent)}
.lens.hero{font-weight:800}
.lsep{width:1px;background:var(--line2);margin:8px 3px;flex:none}

/* ── Legende ── */
.legend{position:fixed;left:14px;bottom:22px;z-index:999;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;width:250px;animation:rise .35s var(--ease)}
.legend h4{font:600 17px var(--serif);letter-spacing:-.01em;margin-bottom:3px}
.legend p{font-size:12px;color:var(--mute);line-height:1.45;margin-bottom:11px}
.bivw{display:flex;gap:12px;align-items:stretch}
.biv{display:grid;grid-template-columns:repeat(3,24px);grid-template-rows:repeat(3,24px);gap:3px;flex:none}
.biv span{border-radius:5px;display:block}
.bivl{display:flex;flex-direction:column;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.3}
.bivl em{font-style:normal;font-weight:600;color:var(--mute)}
.xa{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:6px}
.ramp{height:10px;border-radius:6px;margin:4px 0 5px}
.rlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.types{display:flex;flex-direction:column;gap:4px}
.types button{display:flex;align-items:center;gap:9px;border:none;background:none;text-align:left;padding:5px 6px;border-radius:9px;font-size:12.5px;color:var(--ink);line-height:1.25}
.types button:hover{background:var(--soft)}
.types button.dim{opacity:.35}
.types i{width:14px;height:14px;border-radius:4px;flex:none}
.types em{font-style:normal;margin-left:auto;color:var(--mute);font-size:11px}

/* ── Orts-Karte ── */
.panel{position:fixed;top:74px;right:14px;bottom:22px;width:400px;z-index:1001;background:var(--card);border-radius:22px;box-shadow:var(--sh2);display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .45s var(--ease);border:1px solid var(--line)}
.panel.on{transform:none}
.ph{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.ph .kick{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ph h2{font:600 28px var(--serif);letter-spacing:-.02em;line-height:1.05;margin:5px 0 9px}
.close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center}
.type{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:6px 10px 6px 8px;font-size:12.5px;font-weight:700}
.type i{width:12px;height:12px;border-radius:4px}
.pb{flex:1;overflow-y:auto;padding:18px 22px 24px;scrollbar-width:thin}
.say{font-size:15px;line-height:1.55;color:var(--ink);margin-bottom:18px}
.say b{font-weight:700}
.flag{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(87,66,73,.10),rgba(200,90,90,.08));border:1px solid rgba(87,66,73,.22);border-radius:14px;padding:12px 14px;margin:-4px 0 18px;font-size:13px;line-height:1.45}
.flag svg{flex:none;margin-top:1px;color:#985356}
.h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.h::after{content:"";flex:1;height:1px;background:var(--line)}
.sig{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.row .lb{color:var(--ink2);font-weight:600}
.bar{height:9px;background:var(--soft);border-radius:6px;overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width .8s var(--ease)}
.row .v{font-weight:800;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:9px}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;border:none;border-radius:14px;padding:14px;background:var(--chrome);color:#fff;font:800 14px var(--sans);transition:transform .15s var(--ease),box-shadow .2s}
.cta svg{color:var(--accent)}
.cta:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.cta.ghost{background:var(--soft);color:var(--ink)}
.cta.ghost svg{color:var(--ink2)}
.sim{margin-top:12px;background:var(--soft);border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.5;display:none;animation:rise .35s var(--ease)}
.sim.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}
.chip:hover{border-color:var(--ink)}
.mu{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.mu svg{display:block;width:100%;height:auto;background:var(--soft)}
.mu div{padding:11px 14px 13px}
.mu b{font-size:14px;display:block;margin-bottom:3px}
.mu p{font-size:12.5px;color:var(--ink2);line-height:1.5}
.mu em{display:inline-block;font-style:normal;font-size:11px;font-weight:800;color:#985356;background:rgba(200,90,90,.10);border-radius:6px;padding:2px 7px;margin-bottom:6px}
details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
summary{font-size:12px;font-weight:800;color:var(--ink2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px}
summary::-webkit-details-marker{display:none}
details p{font-size:12px;color:var(--mute);line-height:1.6;margin-top:9px}
.classic{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2);padding-bottom:1px}

/* ── Erstbesuch-Hinweis ── */
.hint{position:fixed;top:134px;left:14px;z-index:999;width:330px;background:var(--chrome);color:#fff;border-radius:var(--r);box-shadow:var(--sh2);padding:16px 18px;animation:rise .5s var(--ease) .3s both}
.hint h3{font:600 19px var(--serif);margin-bottom:6px;letter-spacing:-.01em}
.hint p{font-size:13px;line-height:1.5;color:rgba(255,255,255,.78)}
.hint p b{color:var(--accent);font-weight:700}
.hint button{margin-top:12px;border:none;background:var(--accent);color:var(--chrome);border-radius:10px;padding:9px 14px;font:800 12.5px var(--sans)}
.loading{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s}
.loading.off{opacity:0;pointer-events:none}
.loading div{font:600 22px var(--serif);color:var(--ink2);display:flex;align-items:center;gap:12px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pl 1s infinite alternate}
@keyframes pl{to{transform:scale(1.6);opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* ── Mobil: Kopf kompakt, Linsen oben, Karte als Bottom-Sheet ── */
@media (max-width:760px){
  .top{top:10px;left:10px;right:10px;gap:7px;flex-wrap:wrap}
  .brand small,.brand b{display:none}
  .brand{padding:11px}
  .search{order:2;flex-basis:100%;max-width:none}
  .tools{order:1;margin-left:auto}
  .tools .classicbtn span{display:none}
  .lenses{top:118px;left:10px;right:10px;border-radius:16px}
  body.panel-on .lenses{max-width:none}
  .legend{left:10px;right:10px;bottom:12px;width:auto;padding:11px 13px}
  .legend p{display:none}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:78vh;border-radius:24px 24px 0 0;transform:translateY(105%)}
  .panel.on{transform:none}
  .hint{top:auto;bottom:150px;left:10px;right:10px;width:auto}
  .leaflet-control-zoom{display:none}
  body.panel-on .legend{display:none}
}
</style>
</head>
<body>
<div class="loading" id="loading"><div><span class="pulse"></span><span id="ldTxt">Stadt-Signatur wird geladen …</span></div></div>
<div id="map" role="application" aria-label="Karte"></div>

<header class="top">
  <a class="brand" href="index.html" title="Inspector Nice">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="8" r="3.4" fill="#FFD600"/><circle cx="16.5" cy="7" r="2.6" fill="#c97b4f"/><circle cx="12" cy="16.5" r="3.6" fill="#8ba36e"/><path d="M7 8 12 16.5 16.5 7" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/></svg>
    <span><b>Inspector Nice</b><small id="cityLbl">Utrecht · Stadt-Signatur</small></span>
  </a>
  <div class="search">
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" aria-label="Ort suchen">
    <div class="sugg" id="sugg" role="listbox"></div>
  </div>
  <div class="tools">
    <div class="lang" role="group" aria-label="Sprache"><button data-l="de">DE</button><button data-l="en">EN</button><button data-l="nl">NL</button></div>
    <button class="tbtn" id="themeBtn" aria-label="Hell/Dunkel"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
    <a class="tbtn classicbtn" href="index.html" id="classicBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 10h6"/></svg><span id="classicTxt">Klassische Ansicht</span></a>
  </div>
</header>

<nav class="lenses" id="lenses" aria-label="Linse"></nav>
<aside class="legend" id="legend" aria-live="polite"></aside>

<section class="panel" id="panel" aria-label="Ort">
  <div class="ph">
    <div class="kick" id="pKick"></div>
    <h2 id="pTitle"></h2>
    <span class="type" id="pType"></span>
    <button class="close" id="pClose" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="pb" id="pBody"></div>
</section>

<script>
// ══════════════════════════════════════════════════════════════
// Inspector Nice — Stadt-Signatur (Prototyp der neuen Oberfläche)
// Ein verschmolzenes Bild statt 35 Ebenen: jede 200-m-Zelle trägt
// einen Fingerabdruck aus Klima, Umwelt und sozialer Lage.
// ══════════════════════════════════════════════════════════════
let lang=(()=>{try{return localStorage.getItem('ul_lang')}catch(e){return null}})()||((navigator.language||'').startsWith('nl')?'nl':(navigator.language||'').startsWith('de')?'de':'en');
const T=(de,en,nl)=>lang==='en'?en:lang==='nl'?nl:de;
const STORE={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Merkmale: höher = mehr Belastung (außer Wasser: neutrale Eigenschaft)
const DIM=[
 {k:'heat',  de:'Hitze',            en:'Heat',             nl:'Hitte',            ramp:['#fbe9df','#b34a4a'], why:['Oberflächentemperatur (Satellit) der Gebäude','surface temperature of buildings (satellite)','oppervlaktetemperatuur gebouwen (satelliet)']},
 {k:'green', de:'Grünmangel',       en:'Lack of green',    nl:'Groentekort',      ramp:['#eef2e3','#7a5a32'], why:['Weg zur nächsten Grünfläche ≥ 0,5 ha + Bäume','distance to green ≥ 0.5 ha + trees','afstand tot groen ≥ 0,5 ha + bomen']},
 {k:'dens',  de:'Dichte',           en:'Density',          nl:'Dichtheid',        ramp:['#eeeeee','#2d2d3a'], why:['überbauter Anteil der Fläche','built-up share of the area','bebouwd aandeel']},
 {k:'noise', de:'Verkehrslärm',     en:'Traffic noise',    nl:'Verkeerslawaai',   ramp:['#efeaf5','#5b3f8c'], why:['Nähe zu Hauptstraßen, nach Straßenklasse','proximity to main roads by class','nabijheid hoofdwegen per klasse']},
 {k:'access',de:'Weite Wege',       en:'Long trips',       nl:'Lange afstanden',  ramp:['#e3f1f5','#2a6f8a'], why:['Weg zu Laden, Schule und Arzt','distance to shop, school and doctor','afstand tot winkel, school en huisarts']},
 {k:'co2',   de:'Gebäude-CO₂',      en:'Building CO₂',     nl:'Gebouw-CO₂',       ramp:['#f6efd9','#8a6a12'], why:['Wärmebedarf nach echtem Baujahr (BAG)','heat demand by real construction year (BAG)','warmtevraag naar bouwjaar (BAG)']},
 {k:'social',de:'Soziale Lage',     en:'Social strain',    nl:'Sociale druk',     ramp:['#ece6f0','#574249'], why:['Bijstand, laag inkomen, Wahlbeteiligung (Wijk)','assistance, low income, turnout (wijk)','bijstand, laag inkomen, opkomst (wijk)']},
 {k:'water', de:'Wassernähe',       en:'Near water',       nl:'Nabij water',      ramp:['#e6f0f6','#2f6f9f'], why:['Anteil gewässernaher Gebäude (Näherung)','share of buildings near water (approx.)','aandeel gebouwen nabij water'], neutral:true},
];
const BIV=[['#e8e8e8','#b0d5df','#64acbe'],['#e4acac','#ad9ea5','#627f8c'],['#c85a5a','#985356','#574249']]; // [Umwelt][Sozial] — Stevens
const TYPE_COL=['#b34a4a','#c97b4f','#c9a53f','#8ba36e','#5f7a52','#4f7c8a'];
const I={

 green:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 20A7 7 0 0 1 4 13C4 7 9 3 20 4c1 11-3 16-9 16Z"/><path d="M4 21c4-4 7-6 12-8"/></svg>',

 info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
};
const LENSES=[
 {id:'all',ic:'all',hero:true,de:'Gesamtbild',en:'Full picture',nl:'Totaalbeeld'},
 {id:'types',ic:'types',de:'Stadttypen',en:'City types',nl:'Stadstypen'},
 {sep:true},
 {id:'heat',ic:'heat'},{id:'green',ic:'green'},{id:'noise',ic:'noise'},{id:'dens',ic:'dens'},{id:'access',ic:'access'},{id:'social',ic:'social'},
];

let F=null, MU=[], map, cellLayer, lens=STORE.get('nx_lens')||'all', sel=null, simSet=null, typeFilter=null;

// ── Karte: amtliche Basiskarte (PDOK, Open Data) ──
map=L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:.5,preferCanvas:true}).setView([52.0907,5.1214],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© <a href="https://www.pdok.nl" target="_blank" rel="noopener">Kadaster / PDOK</a> · Signatur: BAG · OSM · CBS'}).addTo(map);
const rend=L.canvas({padding:.4});

function lerp(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((x,i)=>Math.round(x+(B[i]-x)*t).toString(16).padStart(2,'0')).join('');}
function colorOf(c){
  if(lens==='all')return BIV[Math.floor(c.b/3)][c.b%3];
  if(lens==='types')return TYPE_COL[c.t];
  const d=DIM.findIndex(x=>x.k===lens); return lerp(DIM[d].ramp[0],DIM[d].ramp[1],c.v[d]/100);
}
function styleOf(c){
  const base={fillColor:colorOf(c),fillOpacity:.72,color:'#fff',weight:.6,opacity:.55};
  if(typeFilter!=null&&c.t!==typeFilter)return {...base,fillOpacity:.07,opacity:.1};
  if(simSet){
    if(c===sel)return {...base,fillOpacity:.95,color:'#14141f',weight:3,opacity:1};
    if(simSet.has(c))return {...base,fillOpacity:.9,color:'#FFD600',weight:2.2,opacity:1};
    return {...base,fillOpacity:.08,opacity:.08};
  }
  if(c===sel)return {...base,fillOpacity:.9,color:'#14141f',weight:3,opacity:1};
  return base;
}
function drawCells(){
  if(cellLayer)map.removeLayer(cellLayer);
  cellLayer=L.layerGroup();
  const h=F.dLat/2,w=F.dLon/2;
  F.cells.forEach(c=>{
    const r=L.rectangle([[c.c[0]-h,c.c[1]-w],[c.c[0]+h,c.c[1]+w]],{renderer:rend,...styleOf(c)});
    r.on('click',()=>openPlace(c)); r._cell=c; c._r=r; cellLayer.addLayer(r);
  });
  cellLayer.addTo(map);
}
function restyle(){F.cells.forEach(c=>c._r&&c._r.setStyle(styleOf(c)));}

// ── Linsen & Legende ──
function renderLenses(){
  document.getElementById('lenses').innerHTML=LENSES.map(l=>{
    if(l.sep)return '<span class="lsep"></span>';
    const d=DIM.find(x=>x.k===l.id); const name=d?T(d.de,d.en,d.nl):T(l.de,l.en,l.nl);
    return `<button class="lens${l.hero?' hero':''}${lens===l.id?' on':''}" data-id="${l.id}" aria-pressed="${lens===l.id}">${I[l.ic]}${name}</button>`;}).join('');
  document.querySelectorAll('.lens').forEach(b=>b.onclick=()=>{lens=b.dataset.id;STORE.set('nx_lens',lens);typeFilter=null;renderLenses();renderLegend();restyle();if(sel)renderPanel(sel);});
}
function renderLegend(){
  const el=document.getElementById('legend');
  if(lens==='all'){
    let g='';for(let e=2;e>=0;e--)for(let s=0;s<3;s++)g+=`<span style="background:${BIV[e][s]}"></span>`;
    el.innerHTML=`<h4>${T('Gesamtbild','Full picture','Totaalbeeld')}</h4><p>${T('Klima-/Umweltlast und soziale Lage in einer Farbe. Dunkel = doppelte Belastung.','Climate/environmental load and social strain in one colour. Dark = double burden.','Klimaat-/milieudruk en sociale druk in één kleur. Donker = dubbele last.')}</p><div class="bivw"><div class="biv">${g}</div><div class="bivl"><span>↑ ${T('Klima & Umwelt','Climate & environment','Klimaat & milieu')}</span><em>${T('dunkel = beides hoch','dark = both high','donker = beide hoog')}</em></div></div><div class="xa">${T('soziale Lage','social strain','sociale druk')} →</div>`;
  } else if(lens==='types'){
    el.innerHTML=`<h4>${T('Stadttypen','City types','Stadstypen')}</h4><p>${T('Orte mit ähnlicher Signatur, automatisch gruppiert. Klick filtert.','Places with a similar signature, grouped automatically. Click to filter.','Plekken met een vergelijkbare signatuur, automatisch gegroepeerd. Klik filtert.')}</p><div class="types">${F.clusters.map(c=>`<button data-t="${c.id}" class="${typeFilter!=null&&typeFilter!==c.id?'dim':''}"><i style="background:${TYPE_COL[c.id]}"></i>${c.name[lang]||c.name.de}<em>${c.n}</em></button>`).join('')}</div>`;
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;typeFilter=typeFilter===t?null:t;renderLegend();restyle();});
  } else {
    const d=DIM.find(x=>x.k===lens);
    el.innerHTML=`<h4>${T(d.de,d.en,d.nl)}</h4><p>${T(...d.why)}. ${T('Im Vergleich zu ganz Utrecht.','Relative to all of Utrecht.','Ten opzichte van heel Utrecht.')}</p><div class="ramp" style="background:linear-gradient(90deg,${d.ramp[0]},${d.ramp[1]})"></div><div class="rlab"><span>${T('niedrig','low','laag')}</span><span>${T('hoch','high','hoog')}</span></div>`;
  }
}

// ── Ort: Signatur, Klartext, ähnliche Orte, passende Muster ──
const typeName=t=>F.clusters[t].name[lang]||F.clusters[t].name.de;
function say(c){
  const burdens=DIM.map((d,i)=>({d,v:c.v[i]})).filter(x=>!x.d.neutral&&x.d.k!=='social'&&x.v>=66).sort((a,b)=>b.v-a.v).slice(0,3);
  const strengths=DIM.map((d,i)=>({d,v:c.v[i]})).filter(x=>!x.d.neutral&&x.d.k!=='social'&&x.v<=25).sort((a,b)=>a.v-b.v).slice(0,2);
  const pctTxt=v=>T(`als ${v} % der Stadt`,`than ${v}% of the city`,`dan ${v}% van de stad`);
  const phr={heat:T('heißer','hotter','heter'),green:T('grünärmer','less green','groenarmer'),dens:T('dichter bebaut','more built-up','dichter bebouwd'),noise:T('lauter','noisier','lawaaiiger'),access:T('weiter von Laden, Schule und Arzt entfernt','further from shop, school and doctor','verder van winkel, school en arts'),co2:T('energieintensiver gebaut','more energy-intensive','energie-intensiever gebouwd')};
  const good={heat:T('kühl','cool','koel'),green:T('viel Grün in Reichweite','plenty of green nearby','veel groen dichtbij'),dens:T('offen bebaut','openly built','open bebouwd'),noise:T('ruhig','quiet','rustig'),access:T('kurze Wege zum Alltag','short trips to daily needs','korte afstanden'),co2:T('energieeffizient gebaut','energy-efficient','energiezuinig')};
  let s='';
  if(burdens.length) s+=T('Dieser Ort ist ','This place is ','Deze plek is ')+burdens.map(x=>`<b>${phr[x.d.k]}</b> ${pctTxt(x.v)}`).join(', ')+'. ';
  else s+=T('Dieser Ort liegt bei Klima und Umwelt <b>im Mittelfeld</b> von Utrecht. ','This place is <b>mid-range</b> for climate and environment in Utrecht. ','Deze plek zit qua klimaat en milieu <b>in de middenmoot</b> van Utrecht. ');
  if(strengths.length) s+=T('Stärken: ','Strengths: ','Sterke punten: ')+strengths.map(x=>good[x.d.k]).join(T(' und ',' and ',' en '))+'.';
  return s;
}
function matchMuster(c){
  const v=Object.fromEntries(DIM.map((d,i)=>[d.k,c.v[i]]));
  const cand=[
    {id:'M3',s:Math.max(v.heat,v.green),why:T('heiß, wenig Grün','hot, little green','heet, weinig groen')},
    {id:'M4',s:(v.dens+v.heat)/2,why:T('dicht und heiß','dense and hot','dicht en heet')},
    {id:'M7',s:(v.social+v.heat)/2,why:T('sozial belastet und heiß — Kinder zuerst','socially strained and hot — children first','sociaal kwetsbaar en heet — kinderen eerst')},
    {id:'M5',s:v.noise,why:T('laut — weniger Autoverkehr hilft','noisy — less car traffic helps','lawaaiig — minder autoverkeer helpt')},
    {id:'M1',s:v.access,why:T('weite Wege — gute Fußwege zählen','long trips — good footpaths matter','lange afstanden — goede voetpaden tellen')},
  ].filter(x=>x.s>=60).sort((a,b)=>b.s-a.s).slice(0,2);
  return cand.map(x=>({...x,m:MU.find(m=>m.id===x.id)})).filter(x=>x.m);
}
function openPlace(c){
  sel=c; simSet=null; restyle(); renderPanel(c);
  document.getElementById('panel').classList.add('on'); document.body.classList.add('panel-on');
  try{const u=new URL(location.href);u.searchParams.set('at',c.c.join(','));history.replaceState(null,'',u);}catch(e){}
  hideHint();
}
function renderPanel(c){
  const env=c.e, soc=c.v[6], dbl=env>=66&&soc>=66;
  document.getElementById('pKick').textContent=T('Ort in ','Place in ','Plek in ')+c.w+' · 200 m';
  document.getElementById('pTitle').textContent=c.w;
  document.getElementById('pType').innerHTML=`<i style="background:${TYPE_COL[c.t]}"></i>${typeName(c.t)}`;
  const mus=matchMuster(c);
  document.getElementById('pBody').innerHTML=`
    <p class="say">${say(c)}</p>
    ${dbl?`<div class="flag">${I.warn}<span><b>${T('Doppelte Belastung','Double burden','Dubbele last')}:</b> ${T('hohe Klima-/Umweltlast trifft auf eine sozial belastete Nachbarschaft. Hier wirken Maßnahmen doppelt.','high climate/environmental load meets a socially strained neighbourhood. Measures pay off twice here.','hoge klimaat-/milieudruk in een sociaal kwetsbare buurt. Maatregelen werken hier dubbel.')}</span></div>`:''}
    <div class="h">${T('Signatur','Signature','Signatuur')}</div>
    <div class="sig">${DIM.map((d,i)=>`<div class="row" title="${T(...d.why)}"><span class="lb">${T(d.de,d.en,d.nl)}</span><span class="bar"><i data-w="${c.v[i]}" style="background:${d.neutral?d.ramp[1]:lerp(d.ramp[0],d.ramp[1],.35+c.v[i]/160)}"></i></span><span class="v">${c.v[i]}</span></div>`).join('')}</div>
    <p class="note">${T('0–100 = Rang innerhalb Utrechts (50 = Mitte). Soziale Lage gilt für den ganzen Wijk.','0–100 = rank within Utrecht (50 = median). Social strain applies to the whole wijk.','0–100 = rang binnen Utrecht (50 = mediaan). Sociale druk geldt voor de hele wijk.')}</p>
    <button class="cta" id="simBtn">${I.similar}${T('Ähnliche Orte finden','Find similar places','Vergelijkbare plekken')}</button>
    <div class="sim" id="simBox"></div>
    ${mus.length?`<div class="h">${T('Was hier hilft','What helps here','Wat hier helpt')}</div>`+mus.map(x=>`<div class="mu">${x.m.svg}<div><em>${T('Passt, weil','Fits because','Past, want')}: ${x.why}</em><b>${x.m.id} · ${x.m.n[lang]||x.m.n.de}</b><p>${x.m.wirkung[lang]||x.m.wirkung.de}</p></div></div>`).join(''):''}
    <details><summary>${I.info}${T('Woher kommen die Werte?','Where do the values come from?','Waar komen de waarden vandaan?')}</summary>
      <p>${T('Jede 200-m-Zelle bündelt alle Gebäude darin (PDOK BAG: Oberflächentemperatur, Baujahr → CO₂, Gewässernähe), Grün, Bäume und Alltagsorte (OpenStreetMap) sowie die Sozialdaten des Wijks (CBS Kerncijfers 2023). Alle Werte sind Ränge innerhalb Utrechts — sie zeigen, wo ein Ort im Stadtvergleich steht, keine absoluten Grenzwerte. Gewässernähe ist eine Abstands-Näherung, kein Überflutungsmodell.','Each 200 m cell combines its buildings (PDOK BAG: surface temperature, construction year → CO₂, proximity to water), green, trees and everyday places (OpenStreetMap) and the wijk\'s social data (CBS 2023). All values are ranks within Utrecht — relative position, not absolute thresholds. Proximity to water is a distance approximation, not a flood model.','Elke cel van 200 m bundelt de gebouwen (PDOK BAG: oppervlaktetemperatuur, bouwjaar → CO₂, nabijheid water), groen, bomen en voorzieningen (OpenStreetMap) en de sociale data van de wijk (CBS 2023). Alle waarden zijn rangen binnen Utrecht. Nabijheid water is een afstandsbenadering, geen overstromingsmodel.')}</p></details>
    <a class="classic" href="index.html?district=${encodeURIComponent(c.w)}">${T('Alle Details zu','Full details for','Alle details over')} ${c.w} ${T('in der klassischen Ansicht','in the classic view','in de klassieke weergave')} →</a>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%')));
  document.getElementById('simBtn').onclick=()=>findSimilar(c);
}
// Ähnlichkeit: Kosinus der zentrierten Signaturen (wie Embedding-Suche, nur mit lesbaren Merkmalen)
function findSimilar(c){
  const z=v=>v.map(x=>x-50), a=z(c.v), na=Math.hypot(...a)||1;
  const scored=F.cells.filter(x=>x!==c).map(x=>{const b=z(x.v),nb=Math.hypot(...b)||1;return {x,s:a.reduce((t,ai,i)=>t+ai*b[i],0)/(na*nb)};}).sort((p,q)=>q.s-p.s);
  const top=scored.filter(o=>o.s>=.85).slice(0,Math.max(12,Math.round(F.cells.length*.04)));
  simSet=new Set(top.map(o=>o.x)); restyle();
  const byW={};top.forEach(o=>byW[o.x.w]=(byW[o.x.w]||0)+1);
  const box=document.getElementById('simBox');box.classList.add('on');
  box.innerHTML=top.length?`<b>${top.length} ${T('Orte mit sehr ähnlicher Signatur','places with a very similar signature','plekken met een zeer vergelijkbare signatuur')}</b> ${T('in','in','in')} ${Object.keys(byW).length} ${T('Wijken. Was hier hilft, hilft vermutlich auch dort.','wijken. What helps here likely helps there too.','wijken. Wat hier helpt, helpt daar waarschijnlijk ook.')}<div class="chips">${Object.entries(byW).sort((p,q)=>q[1]-p[1]).map(([w,n])=>`<button class="chip" data-w="${w}">${w} · ${n}</button>`).join('')}</div><button class="cta ghost" id="simOff" style="margin-top:12px">${T('Ähnlichkeit ausblenden','Hide similarity','Verberg overeenkomst')}</button>`
    :T('Keine Orte mit sehr ähnlicher Signatur — dieser Ort ist in Utrecht ziemlich einzigartig.','No places with a very similar signature — this place is fairly unique in Utrecht.','Geen plekken met een zeer vergelijkbare signatuur — deze plek is vrij uniek in Utrecht.');
  box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const pts=top.filter(o=>o.x.w===b.dataset.w).map(o=>o.x.c);map.flyToBounds(L.latLngBounds(pts).pad(.3),{...fitPad(),duration:.8,maxZoom:15});});
  const off=document.getElementById('simOff');if(off)off.onclick=()=>{simSet=null;restyle();box.classList.remove('on');};
  if(top.length)map.flyToBounds(L.latLngBounds(top.map(o=>o.x.c).concat([c.c])).pad(.08),{...fitPad(),duration:.9,maxZoom:14.5});
}
// Kartenausschnitt um Kopf, Linsen und Orts-Karte herum wählen (Desktop rechts, Mobil unten)
const fitPad=()=>innerWidth<=760?{paddingTopLeft:[16,170],paddingBottomRight:[16,Math.round(innerHeight*.62)]}:{paddingTopLeft:[24,130],paddingBottomRight:[document.body.classList.contains('panel-on')?440:24,40]};
function closePanel(){document.getElementById('panel').classList.remove('on');document.body.classList.remove('panel-on');sel=null;simSet=null;restyle();try{const u=new URL(location.href);u.searchParams.delete('at');history.replaceState(null,'',u);}catch(e){}}
document.getElementById('pClose').onclick=closePanel;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
const cellAt=(lat,lon)=>F.cells.reduce((b,c)=>{const d=(c.c[0]-lat)**2+((c.c[1]-lon)*.62)**2;return d<b.d?{c,d}:b;},{c:null,d:1e9});

// ── Suche: Wijken lokal + Adressen/Buurten über PDOK Locatieserver (amtlich, ohne Schlüssel) ──
const q=document.getElementById('q'),sg=document.getElementById('sugg');let qT=null,qAbort=null;
q.addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(search,220);});
q.addEventListener('keydown',e=>{const bs=[...sg.querySelectorAll('button')];let i=bs.findIndex(b=>b.classList.contains('act'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();bs.forEach(b=>b.classList.remove('act'));i=e.key==='ArrowDown'?Math.min(bs.length-1,i+1):Math.max(0,i-1);if(bs[i])bs[i].classList.add('act');}
  if(e.key==='Enter'){(bs[i]||bs[0])&&(bs[i]||bs[0]).click();}
  if(e.key==='Escape'){sg.classList.remove('on');}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sg.classList.remove('on');});
function search(){
  const s=q.value.trim(); if(s.length<2){sg.classList.remove('on');return;}
  const wj=[...new Set(F.cells.map(c=>c.w))].filter(w=>w.toLowerCase().includes(s.toLowerCase())).map(w=>({label:w,kind:'Wijk',go:()=>{const cs=F.cells.filter(c=>c.w===w);map.flyToBounds(L.latLngBounds(cs.map(c=>c.c)).pad(.05),{...fitPad(),duration:.8});}}));
  show(wj);
  if(qAbort)qAbort.abort();qAbort=new AbortController();
  fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${encodeURIComponent(s)}&fq=gemeentenaam:Utrecht&rows=6&fl=weergavenaam,centroide_ll,type`,{signal:qAbort.signal})
    .then(r=>r.json()).then(j=>{
      const docs=(j.response&&j.response.docs)||[];
      show(wj.concat(docs.map(d=>{const m=/POINT\(([\d.]+) ([\d.]+)\)/.exec(d.centroide_ll||'');return m?{label:d.weergavenaam.replace(/, Utrecht$| Utrecht$/,''),kind:d.type,go:()=>{const lat=+m[2],lon=+m[1];map.flyTo([lat,lon],16,{duration:.9});const h=cellAt(lat,lon);if(h.c&&h.d<.00002)setTimeout(()=>openPlace(h.c),700);}}:null;}).filter(Boolean)).slice(0,8));
    }).catch(()=>{});
}
function show(items){
  if(!items.length){sg.classList.remove('on');return;}
  sg.innerHTML=items.map((it,i)=>`<button data-i="${i}" role="option">${it.label}<small>${it.kind}</small></button>`).join('');
  sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{items[+b.dataset.i].go();sg.classList.remove('on');q.blur();});
  sg.classList.add('on');
}

// ── Sprache, Theme, Erstbesuch ──
function applyLang(){
  document.documentElement.lang=lang;STORE.set('ul_lang',lang);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  q.placeholder=T('Adresse, Buurt oder Wijk in Utrecht …','Address, neighbourhood or wijk in Utrecht …','Adres, buurt of wijk in Utrecht …');
  document.getElementById('classicTxt').textContent=T('Klassische Ansicht','Classic view','Klassieke weergave');
  document.getElementById('cityLbl').textContent='Utrecht · '+T('Stadt-Signatur','City signature','Stadssignatuur');
  document.getElementById('ldTxt').textContent=T('Stadt-Signatur wird geladen …','Loading city signature …','Stadssignatuur laden …');
  if(F){renderLenses();renderLegend();if(sel)renderPanel(sel);}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});
const theme=STORE.get('nx_theme');if(theme)document.documentElement.dataset.theme=theme;
document.getElementById('themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#101018';const t=dark?'light':'dark';document.documentElement.dataset.theme=t;STORE.set('nx_theme',t);};
function showHint(){
  if(STORE.get('nx_hint'))return;
  const h=document.createElement('div');h.className='hint';h.id='hint';
  h.innerHTML=`<h3>${T('Ein Bild statt 35 Ebenen','One picture instead of 35 layers','Eén beeld in plaats van 35 lagen')}</h3><p>${T('Jede Fläche ist ein 200-m-Ort mit eigener <b>Signatur</b> aus Klima, Umwelt und sozialer Lage. Klicke einen Ort — oder suche deine Adresse.','Each square is a 200 m place with its own <b>signature</b> of climate, environment and social strain. Click a place — or search your address.','Elk vlak is een plek van 200 m met een eigen <b>signatuur</b> van klimaat, milieu en sociale druk. Klik een plek — of zoek je adres.')}</p><button id="hintOk">${T('Verstanden','Got it','Begrepen')}</button>`;
  document.body.appendChild(h);document.getElementById('hintOk').onclick=hideHint;
}
function hideHint(){const h=document.getElementById('hint');if(h){h.remove();STORE.set('nx_hint','1');}}

// ── Laden ──
applyLang();
Promise.all([fetch('data/layers/fusion_utr.json').then(r=>r.json()),fetch('data/muster.json').then(r=>r.json()).catch(()=>[])]).then(([f,mu])=>{
  F=f;MU=mu;drawCells();renderLenses();renderLegend();
  document.getElementById('loading').classList.add('off');
  const at=new URLSearchParams(location.search).get('at');
  if(at){const [la,lo]=at.split(',').map(Number);const h=cellAt(la,lo);if(h.c){map.setView(h.c.c,15);openPlace(h.c);}}
  else showHint();
}).catch(()=>{document.getElementById('ldTxt').textContent=T('Daten konnten nicht geladen werden.','Data could not be loaded.','Data kon niet worden geladen.');});
window.__NX={get F(){return F},get MU(){return MU},openPlace,findSimilar,matchMuster,say,get lens(){return lens},get simSet(){return simSet}};
</script>
