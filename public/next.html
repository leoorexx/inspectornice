<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f1ede5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('nx_look');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Inspector Nice — Klimarisiken in Utrecht</title>
<meta name="description" content="Jeder Ort hat eine Signatur aus Klima, Umwelt und sozialer Lage — ein Bild statt 35 Ebenen.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..600&family=Syne:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --paper:#f1ede5;--ink:#17151c;--ink2:#46424f;--mute:#67626f;--line:rgba(23,21,28,.08);--line2:rgba(23,21,28,.15);
  --glass:rgba(250,248,243,.86);--sheet:rgba(250,248,243,.97);--card:#fbfaf6;--soft:#eee9df;--soft2:#e6e0d4;
  --accent:#FFD600;--chrome:#17151c;--pos:#2f6a55;--neg:#8a2a3a;--warn:#7d5a10;
  --sh:0 1px 1px rgba(23,21,28,.04),0 6px 20px rgba(23,21,28,.08);
  --sh2:0 2px 4px rgba(23,21,28,.06),0 22px 56px rgba(23,21,28,.16);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --serif:'Syne','DM Sans',system-ui,sans-serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --tap:44px;color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#121016;--ink:#f3efe7;--ink2:#cfc9d6;--mute:#938da0;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.15);
  --glass:rgba(27,24,32,.86);--sheet:rgba(27,24,32,.97);--card:#1c1922;--soft:#25212c;--soft2:#2e2936;
  --sh:0 1px 1px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--sh2:0 22px 56px rgba(0,0,0,.55);--pos:#8fd3b6;--neg:#f2a7b1;--warn:#e3b85c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#121016;--ink:#f3efe7;--ink2:#cfc9d6;--mute:#938da0;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.15);
  --glass:rgba(27,24,32,.86);--sheet:rgba(27,24,32,.97);--card:#1c1922;--soft:#25212c;--soft2:#2e2936;
  --sh:0 1px 1px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--sh2:0 22px 56px rgba(0,0,0,.55);--pos:#8fd3b6;--neg:#f2a7b1;--warn:#e3b85c}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:0.875rem;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── Karte: Papierton, Basiskarte tritt zurück ── */
#map{position:fixed;inset:0;background:var(--paper)}
.leaflet-container{background:var(--paper);font-family:var(--sans)}
.leaflet-tile-pane{filter:grayscale(.85) contrast(.82) brightness(1.06) sepia(.12);opacity:.78}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.7) brightness(1.15) contrast(.85);opacity:.9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.7) brightness(1.15) contrast(.85);opacity:.9}}
body[data-base="photo"] .leaflet-tile-pane{filter:saturate(.85) contrast(1.02)!important;opacity:1!important}
body[data-base="osm"] .leaflet-tile-pane{filter:saturate(.55) contrast(.95)!important;opacity:.9!important}
.leaflet-control-attribution{background:transparent!important;color:var(--ink2)!important;font-size:0.6875rem}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-control-zoom{border:none!important;box-shadow:var(--sh)!important;border-radius:14px!important;overflow:hidden;margin:0 14px 18px 0!important}
.leaflet-control-zoom a{background:var(--glass)!important;backdrop-filter:blur(12px);color:var(--ink)!important;border-color:var(--line)!important;width:var(--tap)!important;height:var(--tap)!important;line-height:var(--tap)!important;font-size:1.25rem!important}
.arc{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── Kopf ── */
.top{position:fixed;top:14px;left:14px;right:14px;z-index:1000;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--chrome);color:#f3efe7;border-radius:16px;height:52px;padding:0 16px 0 12px;box-shadow:var(--sh);text-decoration:none;flex:none}
.brand b{font:600 1.0625rem var(--serif);letter-spacing:-.01em;display:block;line-height:1}
.brand small{display:block;font-size:0.6875rem;color:rgba(243,239,231,.55);font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh);padding:0 18px 0 48px;font:500 0.9688rem var(--sans);color:var(--ink);outline:none;transition:box-shadow .25s var(--ease),border-color .25s}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--ink);box-shadow:var(--sh2)}
.search .ic{position:absolute;left:17px;top:17px;color:var(--mute);pointer-events:none}
.sugg{position:absolute;top:58px;left:0;right:0;background:var(--card);border-radius:16px;box-shadow:var(--sh2);overflow:hidden;display:none;border:1px solid var(--line)}
.sugg.on{display:block;animation:pop .2s var(--ease)}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;border:none;background:none;padding:10px 16px;font-size:0.9375rem;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:none}
.sugg button:hover,.sugg button.act{background:var(--soft)}
.sugg i{width:28px;height:28px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2);font-style:normal}
.sugg small{color:var(--mute);font-size:0.6875rem;margin-left:auto;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tools{display:flex;gap:8px;margin-left:auto;flex:none}
.tbtn{height:52px;min-width:52px;padding:0 15px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh);font:700 0.8125rem var(--sans);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none;transition:transform .2s var(--spring),background .2s}
.tbtn:hover{background:var(--card)}
.lang{display:flex;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:5px;height:52px;gap:2px}
.lang button{border:none;background:none;border-radius:11px;min-width:40px;font:800 0.7812rem var(--sans);color:var(--mute);transition:background .2s,color .2s}
.lang button.on{background:var(--chrome);color:var(--accent)}

/* ── Linsen ── */
.lenses{position:fixed;left:14px;top:78px;z-index:999;display:flex;gap:6px;max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;transition:max-width .45s var(--ease);-webkit-mask:linear-gradient(90deg,#000 92%,transparent);mask:linear-gradient(90deg,#000 92%,transparent)}
.lenses::-webkit-scrollbar{display:none}
body.panel-on .lenses{max-width:calc(100vw - 480px)}
.lens{flex:none;height:var(--tap);border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh);border-radius:22px;padding:0 16px 0 12px;font:700 0.8438rem var(--sans);color:var(--ink2);display:flex;align-items:center;gap:9px;white-space:nowrap;transition:background .25s var(--ease),color .25s,transform .2s var(--spring),box-shadow .25s}
.lens:hover{background:var(--card);color:var(--ink)}
.lens .sw{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.lens.on{background:var(--chrome);color:#f3efe7;border-color:var(--chrome);box-shadow:var(--sh2)}
.lens.on .sw{box-shadow:0 0 0 2.5px var(--accent)}

/* ── Legende / Stadtporträt ── */
.legend{position:fixed;left:14px;bottom:18px;z-index:999;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:16px 18px 16px;width:300px;animation:rise .5s var(--ease)}
.legend h4{font:600 1.25rem var(--serif);letter-spacing:-.015em;line-height:1.1}
.legend .lead{font-size:0.7812rem;color:var(--mute);line-height:1.45;margin:4px 0 12px}
.bivw{display:flex;gap:14px;align-items:flex-end}
.biv{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:4px;flex:none}
.biv button{border:none;border-radius:9px;font:800 0.6875rem var(--sans);color:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring),box-shadow .2s;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.biv button.light{color:rgba(23,21,28,.62);text-shadow:none}
.biv button:hover,.biv button.on{transform:scale(1.1);box-shadow:0 0 0 2.5px var(--ink)}
.bivl{font-size:0.75rem;font-weight:700;color:var(--ink2);line-height:1.35;display:flex;flex-direction:column;gap:6px;padding-bottom:2px}
.bivl em{font-style:normal;font-weight:600;color:var(--mute)}
.xa{font-size:0.75rem;font-weight:700;color:var(--ink2);margin-top:8px}
.stat{display:flex;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stat button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 10px;text-align:left;min-height:var(--tap);transition:border-color .2s,transform .2s var(--spring)}
.stat button:hover,.stat button.on{border-color:var(--ink)}
.stat b{display:block;font:600 1.375rem var(--serif);line-height:1}
.stat span{font-size:0.6875rem;color:var(--mute);font-weight:600}
.hist{display:flex;align-items:flex-end;gap:2px;height:56px;margin:2px 0 6px}
.hist i{flex:1;border-radius:3px 3px 1px 1px;min-height:2px;transition:height .6s var(--ease)}
.hist-wrap{position:relative}
.marker{position:absolute;top:-6px;bottom:2px;width:2px;background:var(--ink);border-radius:2px;transition:left .5s var(--ease)}
.marker::after{content:attr(data-v);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:800 0.6875rem var(--sans);background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 5px}
.rlab{display:flex;justify-content:space-between;font-size:0.7188rem;color:var(--mute);font-weight:600}
.types{display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow:auto;margin:0 -6px}
.types button{display:flex;align-items:center;gap:11px;border:none;background:none;text-align:left;padding:5px 6px;border-radius:14px;font-size:0.8125rem;color:var(--ink);line-height:1.25;min-height:52px;transition:background .2s,opacity .25s}
.types button:hover{background:var(--soft)}
.types button.dim{opacity:.32}
.types svg{flex:none}
.types em{font-style:normal;margin-left:auto;color:var(--mute);font-size:0.7188rem;font-weight:700;padding-left:8px}

/* ── Vorschau beim Überfahren ── */
.hov{position:fixed;z-index:1100;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);padding:12px 14px 12px 12px;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(6px) scale(.97);transition:opacity .16s,transform .2s var(--ease);max-width:300px}
.hov.on{opacity:1;transform:none}
.hov b{font:600 1rem var(--serif);display:block;line-height:1.15}
.hov span{font-size:0.75rem;color:var(--mute);line-height:1.35;display:block;margin-top:3px}

/* ── Orts-Karte ── */
.panel{position:fixed;top:14px;right:14px;bottom:14px;width:440px;z-index:1001;background:var(--card);border-radius:28px;box-shadow:var(--sh2);display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .55s var(--ease);border:1px solid var(--line);overflow:hidden}
.panel.on{transform:none}
.grab{display:none}
.ph{padding:22px 24px 6px;position:relative;flex:none}
.ph .kick{font-size:0.6875rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ph h2{font:600 2.125rem var(--serif);letter-spacing:-.025em;line-height:1;margin:7px 0 10px;padding-right:50px}
.close{position:absolute;top:18px;right:18px;width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring),background .2s}
.close:hover{background:var(--soft2)}
.type{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:20px;padding:7px 12px 7px 9px;font-size:0.8125rem;font-weight:700}
.type i{width:12px;height:12px;border-radius:50%}
.pb{flex:1;overflow-y:auto;padding:4px 24px 28px;scrollbar-width:thin;overscroll-behavior:contain}
.hero{display:flex;align-items:center;gap:18px;margin:10px 0 6px}
.hero .rose{flex:none}
.say{font:400 1.0625rem/1.5 var(--serif);color:var(--ink)}
.say b{font-weight:600}
.flag{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,rgba(208,88,60,.12),rgba(76,78,168,.12));border-radius:18px;padding:13px 15px;margin:14px 0 4px;font-size:0.8438rem;line-height:1.45}
.flag svg{flex:none;margin-top:1px}
.h{font-size:0.6875rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:24px 0 11px;display:flex;align-items:center;gap:8px}
.h::after{content:"";flex:1;height:1px;background:var(--line)}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:11px 12px 12px;text-align:left;min-height:72px;transition:border-color .2s,transform .2s var(--spring),box-shadow .2s}
.dt:hover{border-color:var(--line2);box-shadow:var(--sh)}
.dt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dt .t{display:flex;align-items:center;gap:7px;font-size:0.7812rem;font-weight:700;color:var(--ink2)}
.dt .t i{width:9px;height:9px;border-radius:50%;flex:none}
.dt .t b{margin-left:auto;font:600 1.1875rem var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.dt .m{height:6px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.dt .m u{position:absolute;inset:0 auto 0 0;border-radius:4px;width:0;transition:width .9s var(--ease)}
.dt .m::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1.5px;background:var(--line2)}
.dt[disabled]{cursor:default}
.note{font-size:0.75rem;color:var(--mute);line-height:1.5;margin-top:10px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;border:none;border-radius:18px;min-height:56px;padding:0 18px;background:var(--chrome);color:#f3efe7;font:800 0.9375rem var(--sans);transition:transform .2s var(--spring),box-shadow .25s}
.cta svg{color:var(--accent)}
.cta:hover{box-shadow:var(--sh2)}
.cta.ghost{background:var(--soft);color:var(--ink);min-height:var(--tap);font-size:0.8438rem}
.cta.ghost svg{color:var(--ink2)}
.sim{margin-top:12px;background:var(--soft);border-radius:18px;padding:14px 16px;font-size:0.875rem;line-height:1.5;display:none;animation:rise .4s var(--ease)}
.sim.on{display:block}
.sim b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:22px;min-height:40px;padding:0 14px;font-size:0.8125rem;font-weight:700;transition:border-color .2s,transform .2s var(--spring)}
.chip:hover{border-color:var(--ink)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px;padding:2px 24px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mu{flex:0 0 86%;scroll-snap-align:start;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card)}
.mu svg{display:block;width:100%;height:auto;background:#f7f5ef}
.mu div{padding:12px 15px 15px}
.mu em{display:inline-block;font-style:normal;font-size:0.6875rem;font-weight:800;letter-spacing:.02em;color:#a2442c;background:rgba(208,88,60,.12);border-radius:20px;padding:3px 9px;margin-bottom:7px}
.mu b{font:600 1.0625rem var(--serif);display:block;margin-bottom:4px;letter-spacing:-.01em}
.mu p{font-size:0.8125rem;color:var(--ink2);line-height:1.5}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:6px}
summary{font-size:0.8125rem;font-weight:800;color:var(--ink2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:var(--tap)}
summary::-webkit-details-marker{display:none}
details p{font-size:0.7812rem;color:var(--mute);line-height:1.6;margin-top:4px}
.classic{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:0.8125rem;font-weight:700;color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2);padding:6px 0 2px}

/* ── Rosette ── */
.rose path{transform-box:fill-box;transform-origin:center;transition:transform .7s var(--spring),opacity .4s}
.rose.grow path.w{animation:petal .8s var(--spring) both}
@keyframes petal{from{transform:scale(0);opacity:0}}

/* ── Erstbesuch ── */
.intro{position:fixed;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;background:rgba(241,237,229,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s var(--ease)}
:root[data-theme="dark"] .intro{background:rgba(18,16,22,.6)}
.intro .box{background:var(--card);border-radius:28px;box-shadow:var(--sh2);padding:28px 30px 26px;max-width:440px;margin:16px;text-align:center;animation:rise .55s var(--ease)}
.intro h3{font:600 1.875rem/1.08 var(--serif);letter-spacing:-.025em;margin:12px 0 10px}
.intro h3 i{font-style:normal;font-weight:600;box-shadow:inset 0 -.28em 0 rgba(255,214,0,.6)}
.intro p{font-size:0.9375rem;line-height:1.55;color:var(--ink2)}
.intro .row{display:flex;gap:10px;justify-content:center;margin-top:20px}
.intro .go{border:none;background:var(--chrome);color:#f3efe7;border-radius:16px;min-height:52px;padding:0 24px;font:800 0.9375rem var(--sans)}
.intro .go2{border:1px solid var(--line2);background:none;border-radius:16px;min-height:52px;padding:0 20px;font:700 0.875rem var(--sans)}
.loading{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:opacity .6s}
.loading.off{opacity:0;pointer-events:none}
.loading div{font:500 1.5rem var(--serif);color:var(--ink2);display:flex;align-items:center;gap:14px}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px;animation:bob .9s var(--ease) infinite alternate}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{to{transform:translateY(-7px);opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}

/* ── Straßenlabor ── */
.lab-canvas{position:absolute;left:0;top:0;z-index:450;pointer-events:none}
.lab-info{position:absolute;z-index:460;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:9px 13px;font-size:0.8125rem;line-height:1.45;max-width:240px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
.lab-info.on{opacity:1;transform:none}
.lab-info b{font-weight:800}
.lab-info small{display:block;color:var(--mute);font-size:0.6875rem;font-weight:600;margin-top:1px}
.lab-dock{position:fixed;left:14px;top:78px;z-index:999;width:392px;max-height:calc(100vh - 96px);overflow:auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh2);padding:16px 16px 10px;display:none;scrollbar-width:thin;overscroll-behavior:contain}
body.lab-on .lab-dock{display:block;animation:rise .45s var(--ease)}
body.lab-on .legend,body.lab-on .lenses{display:none}
.lab-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.lab-top b{font:600 1.4375rem var(--serif);letter-spacing:-.02em;display:block;line-height:1.05}
.lab-top span{font-size:0.75rem;color:var(--mute);font-weight:600;display:block;margin-top:3px}
.lab-x{margin-left:auto;flex:none;width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;transition:background .2s}
.lab-x:hover{background:var(--soft2)}
.lab-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);border-radius:17px;padding:4px}
.lab-seg button{border:none;background:none;border-radius:13px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 0.7188rem var(--sans);color:var(--ink2);transition:background .25s var(--ease),color .2s}
.lab-seg button:hover{color:var(--ink)}
.lab-seg button.on{background:var(--chrome);color:#f3efe7;box-shadow:var(--sh)}
.lab-seg button.on svg{color:var(--accent)}
.lab-dates{display:flex;gap:6px;margin-top:10px}
.lab-dates button{flex:1;white-space:nowrap;border:1px solid var(--line2);background:var(--card);border-radius:20px;min-height:40px;padding:0 8px;font:700 0.7812rem var(--sans);transition:border-color .2s,background .2s}
.lab-dates button:hover{border-color:var(--ink)}
.lab-dates button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.lab-time{display:flex;align-items:center;gap:10px;margin-top:10px}
.lab-play{flex:none;width:var(--tap);height:var(--tap);border-radius:50%;border:none;background:var(--accent);color:#17151c;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:transform .2s var(--spring)}
.lab-slider{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:var(--tap);background:transparent;cursor:pointer}
.lab-slider::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:linear-gradient(90deg,#3a3470,#d0583c 22%,#f1c45a 50%,#d0583c 78%,#3a3470)}
.lab-slider::-moz-range-track{height:8px;border-radius:5px;background:linear-gradient(90deg,#3a3470,#d0583c 22%,#f1c45a 50%,#d0583c 78%,#3a3470)}
.lab-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--ink);margin-top:-9px;box-shadow:var(--sh)}
.lab-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.lab-clock{font:600 1.4375rem var(--serif);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.lab-sun{display:flex;align-items:center;gap:12px;margin-top:6px}
.lab-dial{flex:none;display:block}
.lab-dial text{font:800 0.5312rem var(--sans);fill:var(--mute)}
.lab-suntxt{font-size:0.7812rem;line-height:1.55;color:var(--ink2)}
.lab-suntxt b{color:var(--ink)}
.lab-mute{color:var(--mute)}
.lab-legw{margin-top:12px}
.lab-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:0.75rem;font-weight:600;color:var(--ink2);margin-top:8px}
.lab-legw>.lab-leg:first-child{margin-top:0}
.lab-leg span{display:inline-flex;align-items:center;gap:6px}
.lab-leg i{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.lab-ramp{height:10px;border-radius:6px}
.lab-rl{display:flex;justify-content:space-between;gap:8px;font-size:0.7188rem;color:var(--mute);font-weight:600;margin-top:5px}
.lab-status{display:none;align-items:center;gap:9px;margin-top:10px;font-size:0.7812rem;font-weight:600;color:var(--ink2);background:var(--soft);border-radius:12px;padding:9px 12px}
.lab-status.on{display:flex}
.lab-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
details.lab-how{margin-top:8px;padding-top:0}
.lab-wind{position:absolute;left:0;top:0;z-index:451;pointer-events:none;display:none}
.lab-tools{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:0 -4px 12px;padding:4px;background:var(--soft);border-radius:18px}
.lab-tools button{border:none;background:none;border-radius:13px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 0.6875rem var(--sans);letter-spacing:-.01em;color:var(--ink2);padding:0 2px;transition:background .25s var(--ease),color .2s;white-space:nowrap}
.lab-tools button:hover{color:var(--ink);background:var(--card)}
.lab-tools button.on{background:var(--chrome);color:#f3efe7;box-shadow:var(--sh)}
.lab-tools button.on svg{color:var(--accent)}
.lab-body .lab-seg{grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin-bottom:2px}
.lab-body .lab-seg button{min-height:44px;flex-direction:row;gap:7px;font-size:0.7812rem}
.lab-hint{font-size:0.7812rem;line-height:1.5;color:var(--mute);margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.lab-base{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:0.7188rem;font-weight:700;color:var(--mute)}
.lab-base>span{margin-right:2px}
.lab-base button{border:1px solid var(--line2);background:var(--card);border-radius:16px;min-height:32px;padding:0 10px;font:700 0.7188rem var(--sans);color:var(--ink2)}
.lab-base button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lab-osm{margin-left:auto;color:var(--ink2);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px;border-bottom:1px solid var(--line2)}
.cta.lab-mini{min-height:44px;margin-top:10px;font-size:0.7812rem;justify-content:flex-start;padding:0 14px}
.cta.lab-mini svg{flex:none}
/* Straße */
.sx-empty{display:flex;gap:14px;align-items:center;margin-top:12px;font-size:0.8125rem;line-height:1.5;color:var(--ink2)}
.sx-empty svg{flex:none}
.sx-head{margin:12px 0 4px}
.sx-head b{font:600 1.25rem var(--serif);letter-spacing:-.015em;display:block;line-height:1.1}
.sx-head span{font-size:0.75rem;color:var(--mute);font-weight:600}
.sx{display:block;margin-top:6px}
.sx text{font-family:var(--sans)}
.sx .sx-h{font-size:0.75rem;font-weight:800;fill:var(--ink)}
.sx .sx-w{font-size:0.7188rem;font-weight:700;fill:var(--ink2)}
.sx .sx-c{font-size:0.7188rem;font-weight:800;fill:var(--mute)}
.sx .sx-tot{font-size:0.7188rem;font-weight:700;fill:var(--ink2)}
.sx-hit{fill:transparent;cursor:pointer;transition:fill .2s}
.sx-hit:hover{fill:rgba(255,214,0,.12)}
.sx-hit.on{fill:rgba(255,214,0,.2)}
.sx-sun{font-size:0.7812rem;color:var(--ink2);margin:6px 0 2px}
.sx-legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.sx-seg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:14px;min-height:44px;padding:0 12px;font:700 0.75rem var(--sans);color:var(--ink2)}
.sx-seg i{width:12px;height:12px;border-radius:3px;flex:none}
.sx-seg em{font-style:normal;color:var(--mute);font-weight:600}
.sx-seg.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sx-seg.ed{border-color:#d9b400;background:rgba(255,214,0,.12)}
.sx-pal{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;padding:8px;border-radius:14px;background:var(--soft)}
.sx-pal button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--card);border-radius:11px;min-height:44px;padding:0 10px;font:700 0.7812rem var(--sans);color:var(--ink)}
.sx-pal button i{width:14px;height:14px;border-radius:4px;flex:none}
.sx-pal button.on{border-color:var(--ink)}
.sx-tab{width:100%;border-collapse:collapse;margin-top:12px;font-size:0.7812rem}
.sx-tab th{text-align:left;font-weight:600;color:var(--ink2);padding:5px 0}
.sx-tab thead th{font-size:0.7188rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sx-tab td{text-align:right;font-weight:800;padding:5px 0 5px 10px;font-variant-numeric:tabular-nums}
.sx-tab td.up{color:var(--pos)}.sx-tab td.down{color:var(--neg)}
.sx-tab tr+tr th,.sx-tab tr+tr td{border-top:1px solid var(--line)}
/* Wasser */
.wt-cls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.wt-cls button{border:1px solid var(--line2);background:var(--card);border-radius:12px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--sans);color:var(--ink2)}
.wt-cls b{font-size:0.75rem;font-weight:800;color:var(--ink)}
.wt-cls span{font-size:0.6875rem;font-weight:600;color:var(--mute)}
.wt-cls button.on{background:var(--ink);border-color:var(--ink)}
.wt-cls button.on b,.wt-cls button.on span{color:var(--paper)}
.wt-cap{font-size:0.7812rem;line-height:1.5;color:var(--ink2);margin-top:10px}
.wt-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:0.7188rem;font-weight:600;color:var(--ink2)}
.wt-leg span{display:inline-flex;align-items:center;gap:5px}
.wt-leg i{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line2)}
.wt-leg-c{flex-direction:column;gap:3px}
.fz{margin-top:14px;padding:12px 12px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.fz-h b{font:600 1rem var(--serif);display:block;letter-spacing:-.01em}
.fz-h span{font-size:0.6875rem;color:var(--mute);font-weight:600}
.fz-row{display:grid;grid-template-columns:96px 1fr;grid-template-areas:"l n" "b b";gap:3px 8px;margin-top:10px}
.fz-l{grid-area:l;font-size:0.75rem;font-weight:700;color:var(--ink2);line-height:1.25}
.fz-n{grid-area:n;display:flex;gap:6px;justify-content:flex-end;align-items:baseline;font-size:0.75rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.fz-n b{font:600 1rem var(--serif);color:var(--ink)}
.fz-bars{grid-area:b;position:relative;height:14px;border-radius:7px;background:var(--soft)}
.fz-b{position:absolute;top:0;bottom:0;border-radius:7px}
.fz-b.now{left:0;background:#c9a24a;opacity:.9}
.fz-b.r50{background:#e0703c;opacity:.85;top:3px;bottom:3px}
.fz-b.r00{background:#8a2a3a;opacity:.55;top:5px;bottom:5px}
.fz-key{display:flex;gap:12px;margin-top:8px;font-size:0.6875rem;font-weight:600;color:var(--mute)}
.fz-key i{display:inline-block;width:12px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}
.fz-key i.now{background:#c9a24a}.fz-key i.r50{background:#e0703c}.fz-key i.r00{background:#8a2a3a;opacity:.55}
.fz-uhi{font-size:0.75rem;line-height:1.5;color:var(--ink2);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

.wt-lvl{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:0.7812rem;font-weight:700;color:var(--ink2)}
.wt-lvl input{flex:1;min-width:0;height:var(--tap);accent-color:#2f6fa8}
.wt-lvl b{font:600 1.0625rem var(--serif);color:var(--ink);min-width:88px;text-align:right;font-variant-numeric:tabular-nums}
.wt-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wt-chips button{flex:1;border:1px solid var(--line2);background:var(--card);border-radius:20px;min-height:40px;padding:0 10px;font:700 0.7812rem var(--sans);color:var(--ink)}
.wt-chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wt-chips button[disabled]{opacity:.4;cursor:default}
.wt-rg{margin-top:10px}
.wt-play{display:flex;align-items:center;gap:10px;margin-top:10px;font:700 0.7188rem var(--sans);color:var(--mute)}
.wt-play input{flex:1;min-width:0;height:var(--tap);accent-color:#2f6fa8}
.kp-sw{background:repeating-linear-gradient(135deg,#b0302a 0 3px,transparent 3px 6px)!important;box-shadow:inset 0 0 0 1.5px #b0302a}
.wt-kp{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:0.7812rem;line-height:1.45;color:var(--ink2);padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#b0302a 8%,transparent)}
.wt-kp b{color:var(--ink)}
.wt-warn{font-size:0.75rem;line-height:1.5;color:var(--warn);background:rgba(233,162,59,.14);border-radius:12px;padding:9px 11px;margin-top:10px}
.wt-tab{border-collapse:collapse;margin-top:4px;font-size:0.75rem}
.wt-tab th{font-weight:600;color:var(--mute);text-align:left;padding:1px 10px 1px 0}
.wt-tab td{font-weight:800;text-align:right}
.wt-tab tr.on th,.wt-tab tr.on td{color:var(--ink);background:rgba(255,214,0,.2)}
/* Wind */
.wd-now{display:flex;align-items:center;gap:12px;margin-top:4px}
.wd-big b{font:500 2.75rem/1 var(--serif);letter-spacing:-.03em;display:block}
.wd-big span{font-size:0.7188rem;color:var(--mute);font-weight:700}
.wd-arrow svg{display:block;transform:rotate(var(--r));transition:transform .6s var(--ease)}
.wd-num{display:flex;flex-direction:column;gap:2px;font-size:0.7188rem;color:var(--mute);font-weight:600}
.wd-num b{font:600 1.125rem var(--serif);color:var(--ink)}
.wd-tl{display:block;margin-top:10px;cursor:pointer}
.wd-tl .wd-ax{font:700 0.5938rem var(--sans);fill:var(--mute)}
/* Fläche */
.ar-head{margin-top:12px}
.ar-head b{font:500 1.875rem/1 var(--serif);letter-spacing:-.02em;display:block}
.ar-head span{font-size:0.75rem;color:var(--mute);font-weight:700}
.ar-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:10px;box-shadow:inset 0 0 0 1px var(--line2)}
.ar-bl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:0.7188rem;font-weight:600;color:var(--ink2)}
.ar-bl span{display:inline-flex;align-items:center;gap:5px}
.ar-bl i{width:11px;height:11px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line2)}
.ar-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.ar-grid div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.ar-grid b{font:600 1.1875rem var(--serif);display:block;font-variant-numeric:tabular-nums}
.ar-grid span{font-size:0.6875rem;color:var(--mute);font-weight:600}
.ar-gen{font-size:0.75rem;color:var(--ink2);margin-top:10px;line-height:1.5}
.ar-gen em{font-style:normal;color:var(--mute);font-weight:700}
.ar-ins{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ar-ins p{font:400 0.875rem/1.45 var(--serif);color:var(--ink);padding-left:12px;border-left:3px solid var(--accent)}
.ar-act{display:flex;flex-direction:column}
.ex-fmt button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* 3D-Ansicht */
.lab-3dbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:10px;padding:0 14px;border-radius:16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:700 0.8125rem var(--sans);text-align:left}
.lab-3dbtn svg{color:var(--accent);flex:none}
.lab-3dbtn.on{background:var(--card);color:var(--ink)}.lab-3dbtn.on svg{color:var(--ink)}
.v3d{position:absolute;inset:0;z-index:760;background:#d6e4ef;touch-action:none}
.v3d canvas{display:block;width:100%;height:100%;cursor:grab}.v3d canvas:active{cursor:grabbing}
.v3-bar{position:absolute;right:14px;top:78px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 430px)}
.v3-bar button{min-height:var(--tap);padding:0 14px;border-radius:22px;border:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:700 0.7812rem var(--sans);color:var(--ink);box-shadow:var(--sh)}
.v3-bar button.on{background:var(--chrome);color:var(--accent)}
.v3-bar .v3-x{background:var(--chrome);color:#f3efe7}
.v3-play{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 430px));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:var(--sh);padding:8px 10px 10px;color:var(--ink)}
.v3-modes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--soft);border-radius:16px;padding:3px}
.v3-modes button{min-height:40px;border:0;border-radius:13px;background:none;font:700 0.7812rem var(--sans);color:var(--ink2)}
.v3-modes button.on{background:var(--chrome);color:var(--accent)}
.v3-pane{padding:8px 4px 0;font-size:0.7812rem;line-height:1.45;color:var(--ink2)}
.v3-pane p{margin-top:6px}.v3-pane b{color:var(--ink)}
.v3-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.v3-row button{min-height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line2);background:var(--card);font:700 0.75rem var(--sans);color:var(--ink)}
.v3-row button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.v3-lvl{display:flex;align-items:center;gap:10px;margin-top:8px}.v3-lvl input{flex:1;height:var(--tap);accent-color:#2f6fa8}.v3-lvl b{font:700 0.9375rem var(--serif);min-width:92px;text-align:right}
.v3-hud{display:flex;gap:16px;margin-top:4px}.v3-hud span{font-size:0.75rem}.v3-hud b{font:700 1.625rem/1 var(--serif);color:var(--ink);margin-right:4px}
.v3-err{color:#a3283a!important}
.v3-bar button.on{background:var(--chrome);color:var(--accent)}
@media (max-width:760px){.lang button{min-height:44px;min-width:44px}.lgrp{min-height:44px}.sevbar button{min-height:48px}}
@media (max-width:760px){.v3-play{width:calc(100% - 16px);bottom:auto;top:118px}}
.v3-year{position:absolute;right:24px;bottom:70px;text-align:right;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none;color:#17151c}
.v3-year.on{opacity:1;transform:none}
.v3-year b{display:block;font:700 4.75rem/1 var(--serif);letter-spacing:-.04em}
.v3-year span{font:600 0.8125rem var(--sans)}
.v3-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:600 0.7188rem var(--sans);color:#46424f;background:rgba(250,248,243,.8);padding:6px 12px;border-radius:14px;white-space:nowrap}
body.v3d-on .leaflet-control-zoom,body.v3d-on .ptsbtn{display:none}
@media (max-width:760px){.v3-bar{top:70px;right:8px;max-width:calc(100% - 16px)}.v3-year b{font-size:3.375rem}.v3-year{bottom:46vh}.v3-hint{display:none}}
/* Handeln */
.actchip svg{color:#c49a2b}.actchip.on{background:var(--chrome);color:#f3efe7}.actchip.on svg{color:var(--accent)}
body.act-on .legend{display:none}

.nxk-q input{flex:1;align-self:stretch;border:none;background:none;outline:none;font:500 1.0625rem var(--sans);color:var(--ink);min-width:0}
.nxk-l{max-height:52vh;overflow:auto;padding:6px}
.nxk-l button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:none;background:none;border-radius:12px;padding:4px 10px;text-align:left;color:var(--ink2)}
.nxk-l button.on,.nxk-l button:hover{background:var(--soft)}
.nxk-l button span{display:flex;flex-direction:column;min-width:0}.nxk-l b{font:700 0.875rem var(--sans);color:var(--ink)}.nxk-l small{font-size:0.75rem;color:var(--mute)}
.nxk-e{padding:16px;color:var(--mute)}.nxk-f{padding:8px 16px 10px;font-size:0.7188rem;color:var(--mute);border-top:1px solid var(--line)}
@media (max-width:760px){

  .nxd-cs{grid-template-columns:1fr}.nxr{grid-template-columns:1fr}
  .nxpick{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .nxk-ov{padding:10px;align-items:flex-start}
  .heatbtn{padding:0 10px}
}

@media (min-width:761px) and (max-width:1180px){body.panel-on .search:not(:focus-within){flex:0 0 52px}body.panel-on .search:not(:focus-within) input{color:transparent;padding-right:0}body.panel-on .search:not(:focus-within) input::placeholder{color:transparent}}

/* Werkzeuge in zwei Gruppen: Verstehen | Gestalten */
.lab-tgs{display:flex;flex-direction:column;gap:6px;margin:0 -4px 12px}

.lab-tgc{flex:0 0 66px;font:700 0.75rem var(--sans);color:var(--mute);padding-left:4px}
.lab-tg .lab-tools{flex:1;margin:0;grid-template-columns:repeat(var(--n),1fr)}
@media (max-width:760px){
  .lab-tgs{order:10;flex-direction:row;overflow-x:auto;margin:8px -4px 0;gap:6px;scrollbar-width:none}.lab-tgs::-webkit-scrollbar{display:none}
  .lab-tg{flex:none;flex-direction:column;align-items:flex-start;gap:2px}.lab-tgc{flex:none;font-size:0.6875rem;padding-left:8px}
  .lab-tg .lab-tools{order:0;margin:0;overflow:visible;display:flex}
}

/* Standort-Check (js/lab-standort.js) */
.sc-top{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.sc-top b{display:block;font:700 0.9375rem var(--sans);color:var(--ink)}.sc-top span{font-size:0.75rem;color:var(--mute);line-height:1.4}
.sc-num{font:600 1.25rem var(--serif);fill:var(--ink)}
.sc-list{display:flex;flex-direction:column}
.sc-row{display:flex;align-items:center;gap:10px;min-height:46px;border-top:1px solid var(--line)}
.sc-row>i{width:11px;height:11px;border-radius:50%;flex:none}
.sc-n{flex:1;min-width:0}.sc-n b{display:block;font:700 0.8125rem var(--sans);color:var(--ink)}.sc-n small,.sc-v small{font-size:0.7188rem;color:var(--mute)}
.sc-v{text-align:right}.sc-v b{display:block;font:600 1.125rem var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.sc-f{font-style:normal;font-size:0.75rem;color:var(--mute)}
.sc-h{margin-top:16px}
.sc-cl{display:flex;flex-direction:column;gap:8px}
.sc-cl>div{display:flex;align-items:center;gap:10px;font-size:0.7812rem;color:var(--ink2)}
.sc-cl b{min-width:58px;font:700 0.875rem var(--sans);color:var(--ink)}.sc-cl b.bad{color:var(--neg)}

/* Lesbarkeit im Quartiersprofil (gemessen: Jahreszahlen 9,6 px, „stadtweit", „/25", Begründungen unter 4,5 : 1) */
.rcl .pts small{opacity:1;color:var(--mute)}
.facts small{opacity:1;font-size:0.6875rem;color:var(--mute)}
.chip2.city{color:#245a8c}
:root[data-theme="dark"] .chip2.city{color:#9cc4ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip2.city{color:#9cc4ec}}
.mu em{color:#8f3520}
:root[data-theme="dark"] .mu em{color:#ffb4a3;background:rgba(232,120,96,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mu em{color:#ffb4a3;background:rgba(232,120,96,.16)}}

.wcol{color:#245a8c}:root[data-theme="dark"] .wcol{color:#9cc4ec}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wcol{color:#9cc4ec}}

/* 3D: Regler in der Szene (wie Shadowmap), Legenden */
.v3-tl{display:grid;grid-template-columns:auto 1fr auto 58px;align-items:center;gap:8px;margin-top:8px;font-size:0.7188rem;color:var(--mute);font-variant-numeric:tabular-nums}
.v3-tl input{width:100%;accent-color:#e3a800;min-height:32px}

.v3-leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:0.75rem;color:var(--ink2)}
.v3-leg span{display:inline-flex;align-items:center;gap:6px}.v3-leg i{width:12px;height:12px;border-radius:4px;flex:none}
.v3-note{font-size:0.75rem!important;color:var(--mute)!important;margin-top:6px}
.v3-modes button{font-size:0.7812rem}
@media (max-width:760px){.v3-tl{grid-template-columns:auto 1fr auto 48px;gap:6px}}

/* Utrecht jetzt, Kühle Route, Straßenfoto */
.now-t{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.now-t>div{background:var(--soft);border-radius:14px;padding:10px 12px}.now-t b{display:block;font:600 1.375rem var(--serif);color:var(--ink)}.now-t span{font-size:0.75rem;color:var(--mute)}
.now-r{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;height:66px;margin-top:6px}
.now-r div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}.now-r i{width:100%;border-radius:4px 4px 0 0;background:#5a9ee6}.now-r span{font-size:0.6875rem;color:var(--mute);min-height:14px}
.now-a{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.now-a>div{border:1px solid var(--line2);border-radius:14px;padding:10px 12px}.now-a b{color:var(--ink)}.now-a small{display:block;font-size:0.75rem;color:var(--mute);margin-bottom:6px}.now-a p{margin-top:4px;font-size:0.8125rem}.now-a p b{font-size:1rem}
.leaflet-tooltip.nx-air{font:700 0.75rem var(--sans);border-radius:10px;padding:4px 8px}
.rt-row{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.rt-row>i{width:26px;height:6px;border-radius:3px;flex:none}.rt-row.cool>i{background:linear-gradient(90deg,#e8964a,#2f8a6a)}.rt-row.fast>i{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px)}
.rt-row>div{flex:1}.rt-row b{display:block;font:700 0.8438rem var(--sans);color:var(--ink)}.rt-row small{font-size:0.75rem;color:var(--mute)}
.rt-row em{font-style:normal;text-align:right;font:600 1.25rem var(--serif);color:var(--ink)}.rt-row em small{display:block;font:500 0.6875rem var(--sans);color:var(--mute)}
.rt-sum{font-size:0.8125rem;color:var(--ink2);margin:6px 0}
.sc-ph{margin:14px 0 0}.sc-ph img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block;background:var(--soft)}
.sc-ph figcaption{font-size:0.7188rem;color:var(--mute);margin-top:5px;line-height:1.4}
@media (max-width:760px){.now-t{grid-template-columns:repeat(2,1fr)}.now-a{grid-template-columns:1fr}}

/* HIG aus Nutzersicht: Fokus sichtbar auf jedem Grund (dunkler Ring + gelber Halo), Suchfelder zeigen Fokus am Rahmen */
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--accent)}
.nxd-q:focus-within,.nxk-q:focus-within{box-shadow:0 0 0 2.5px var(--ink),0 0 0 5px var(--accent)}
.search input:focus-visible{outline:2.5px solid var(--ink);box-shadow:0 0 0 5px var(--accent)}
/* Erhöhter Kontrast (Systemeinstellung): kräftigere Linien, keine zarten Grautöne, keine Transparenz */
@media (prefers-contrast:more){

}
@media (prefers-contrast:more) and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mute:#cfc9d6;--ink2:#e6e1ec;--line:rgba(255,255,255,.3);--line2:rgba(255,255,255,.55);--glass:var(--card);--sheet:var(--card)}}

/* CAD-Paket und Gebäudeanalyse (js/lab-cad.js) */
.ex-card{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line2);border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--card)}
.ex-ct b{display:block;font:700 0.875rem var(--sans);color:var(--ink)}.ex-ct span{display:block;font-size:0.75rem;line-height:1.4;color:var(--mute);margin-top:2px}
.ex-cb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ex-cb select{min-height:36px;border:1px solid var(--line2);border-radius:10px;background:var(--soft);color:var(--ink);font:600 0.78rem var(--sans);padding:0 8px}
.ex-go{margin-left:auto;min-height:40px;border:none;border-radius:11px;padding:0 14px;background:var(--chrome);color:#f3efe7;font:800 0.8rem var(--sans)}
.ex-go:disabled{opacity:.55}
.ex-in{display:inline-flex;align-items:center;gap:6px;font:600 0.78rem var(--sans);color:var(--ink2)}.ex-in input{width:18px;height:18px;accent-color:var(--chrome)}
.ex-r{display:flex;gap:6px;margin-top:8px}.ex-r button{flex:1;white-space:nowrap;min-height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font:700 0.75rem var(--sans);color:var(--ink2);padding:0 8px}.ex-r button.on{background:var(--chrome);color:#f3efe7;border-color:var(--chrome)}
.ex-raw{margin-top:14px}.ex-raw summary{min-height:44px;display:flex;align-items:center;font:700 0.8rem var(--sans);color:var(--ink2);cursor:pointer}
.gb-h b{display:block;font:600 1.15rem var(--serif);color:var(--ink);margin-top:4px}.gb-h span{font-size:0.75rem;color:var(--mute)}
.gb-mon{margin-top:6px;font:700 0.8rem var(--sans);color:#8f3520}.gb-mon a{color:inherit}
.gb-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gb-r{background:var(--soft);border-radius:12px;padding:8px 10px}.gb-r span{display:block;font-size:0.72rem;color:var(--mute)}.gb-r b{display:block;font:600 1.05rem var(--serif);color:var(--ink)}.gb-r small{display:block;font-size:0.7rem;color:var(--mute)}
.gb-hh{margin-top:16px}
.gb-f{display:flex;flex-direction:column;gap:6px}.gb-f div{display:grid;grid-template-columns:44px 1fr 74px;align-items:center;gap:8px;font-size:0.78rem;color:var(--ink2)}
.gb-f i{height:8px;border-radius:4px;background:#2f6fa8}.gb-f div:nth-child(2) i{background:#e3a800}.gb-f div:nth-child(3) i{background:#d0583c}.gb-f div:nth-child(4) i{background:#7a4ea8}.gb-f b{text-align:right;color:var(--ink)}
.gb-x{margin-top:12px}
:root[data-theme="dark"] .gb-mon{color:#ffb4a3}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gb-mon{color:#ffb4a3}}
/* Tippflächen am Handy: mindestens 44 px — steht bewusst am Ende, damit spätere Grundregeln (z. B. 40 px) sie nicht überschreiben */

}

 water:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9c1.7-1.6 3.3-1.6 5 0s3.3 1.6 5 0 3.3-1.6 5 0 3.3 1.6 5 0"/><path d="M2 15c1.7-1.6 3.3-1.6 5 0s3.3 1.6 5 0 3.3-1.6 5 0 3.3 1.6 5 0"/></svg>',
 tree:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="6"/><path d="M12 15v6"/></svg>',
 shade:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18"/><path d="M6 20c0-5 3-9 6-11 3 2 6 6 6 11"/><path d="M12 9V4"/></svg>',
};

// ── Die fünf Risiken, je mit Richtwert und Quelle ──
const RISKS=[
 {id:'hitze',ic:'heat',col:'#d0583c',v:b=>b.v.uhi,over:v=>v>=1.5,pt:v=>(v-.5)/2,full:'+2,5 °C',f:v=>'+'+nf(v,1)+' °C',lim:'+1,5 °C',limv:1.5,min:0,max:2.6,

   rule:()=>T('starke Wärmeinsel ab +1,5 °C im Sommermittel (obere Klassen der RIVM-Karte)','strong heat island from +1.5 °C summer average (upper classes of the RIVM map)','sterk hitte-eiland vanaf +1,5 °C zomergemiddelde (hoogste klassen RIVM-kaart)'),
   src:'RIVM 2022 · GGD-Gezondheidsmonitor 2024'},
 {id:'laerm',ic:'noise',col:'#a05a9a',v:b=>b.v.lden,over:v=>v>53,pt:v=>(v-53)/10,full:'63 dB',f:v=>nf(v,0)+' dB',lim:'53 dB',limv:53,min:40,max:70,
   de:'Verkehrslärm',en:'Traffic noise',nl:'Verkeerslawaai',
   rule:()=>T('WHO-Richtwert Straßenverkehr: 53 dB L<sub>den</sub>','WHO guideline for road traffic: 53 dB L<sub>den</sub>','WHO-richtwaarde wegverkeer: 53 dB L<sub>den</sub>'),src:'RIVM 2022 · GGD-Gezondheidsmonitor 2024'},
 {id:'gruen',ic:'tree',col:'#5f7f2e',v:b=>b.v.blatt!=null?b.v.blatt:b.v.krone,over:v=>v<30,pt:v=>(30-v)/25,full:'5 %',f:v=>nf(v,0)+' %',lim:'30 %',limv:30,min:0,max:50,inv:true,
   de:'Kronendach',en:'Tree canopy',nl:'Kronendak',
   rule:()=>T('Ziel 30 % Kronendach je Quartier (3-30-300-Regel)','target 30 % canopy per neighbourhood (3-30-300 rule)','doel 30 % kronendak per buurt (3-30-300-regel)'),src:'Gemeente Utrecht (Luftbild 2022)'},
 {id:'schatten',ic:'shade',col:'#3f6f5a',v:b=>b.v.wegschatten,over:v=>v<40,pt:v=>(40-v)/30,full:'10 %',f:v=>nf(v,0)+' %',lim:'40 %',limv:40,min:0,max:60,inv:true,
   de:'Schatten auf Wegen',en:'Shade on paths',nl:'Schaduw op routes',
   rule:()=>T('Richtwert 40 % Schatten auf Fuß- und Radwegen (Landelijke Maatlat); Werte der Gemeente 2023','guideline 40 % shade on footpaths and cycle paths (national Maatlat); municipal values 2023','richtwaarde 40 % schaduw op loop- en fietsroutes (Landelijke Maatlat); gemeentewaarden 2023'),src:'Gemeente Utrecht (Schaduw wegdelen 2023)'},
 {id:'wasser',ic:'water',col:'#2f6fa8',v:b=>b.v.flut,over:v=>v>=3,city:true,f:v=>FLUT(v),lim:T('„klein"','"small"','„klein"'),limv:3,min:0,max:5,cls:true,
   de:'Überflutung',en:'Flooding',nl:'Overstroming',
   rule:()=>T('ab Klasse „klein": mehr als 20 cm Wasser öfter als 1× in 3.000 Jahren, an mindestens einer Stelle','from class "small": more than 20 cm of water more often than once in 3,000 years, somewhere in the area','vanaf klasse „klein": meer dan 20 cm water vaker dan 1× per 3.000 jaar, ergens in de buurt'),src:'LIWO, Rijkswaterstaat'},
];
const FLUT=v=>v==null?'—':v<1?T('nicht erfasst','not mapped','niet in kaart'):[T('extrem klein','extremely small','extreem klein'),T('sehr klein','very small','zeer klein'),T('klein','small','klein'),T('mittel','medium','middelgroot'),T('groß','large','groot')][Math.round(v)-1];
// Weitere Kartenthemen (Menschen & Wandel)
const MORE=[
 {id:'niedrig',g:'menschen',col:'#4c4ea8',v:b=>b.v.niedrig,f:v=>nf(v,0)+' %',de:'Niedriges Einkommen',en:'Low income',nl:'Laag inkomen',def:()=>T('Haushalte in den unteren 40 % der Einkommen in NL (CBS 2023)','households in the bottom 40 % of incomes in NL (CBS 2023)','huishoudens in de laagste 40 % van de inkomens (CBS 2023)')},
 {id:'senioren',g:'menschen',col:'#9a6a3a',v:b=>b.v.senioren,f:v=>nf(v,0)+' %',de:'65 Jahre und älter',en:'Aged 65+',nl:'65 jaar en ouder',def:()=>T('Anteil der Einwohner ab 65 (CBS 2024) — bei Hitze besonders gefährdet','share of residents aged 65+ (CBS 2024) — particularly at risk in heat','aandeel inwoners van 65+ (CBS 2024) — extra kwetsbaar bij hitte')},
 {id:'einsam',g:'menschen',col:'#7a6a8a',v:b=>b.v.einsam,f:v=>nf(v,0)+' %',de:'Stark einsam',en:'Severely lonely',nl:'Sterk eenzaam',def:()=>T('Erwachsene, die sich stark einsam fühlen (GGD-Monitor 2024, Modell) — bei Hitzewellen ein Risiko','adults who feel severely lonely (GGD monitor 2024, model) — a risk in heatwaves','volwassenen die zich sterk eenzaam voelen (GGD-monitor 2024, model) — een risico bij hittegolven')},
 {id:'kuehl',g:'menschen',col:'#2a8a9f',v:b=>b.v.kuehlinnen,f:v=>nf(v,0)+' %',de:'Kühlt zu Hause gut ab',en:'Can cool down at home',nl:'Kan thuis goed afkoelen',def:()=>T('Erwachsene, die nach eigener Angabe bei Hitze in der Wohnung gut Abkühlung finden (GGD-Monitor 2024, Modell)','adults who say they can find good cooling at home in heat (GGD monitor 2024, model)','volwassenen die volgens zichzelf bij hitte thuis goed verkoeling vinden (GGD-monitor 2024, model)')},
 {id:'leefbaar',g:'menschen',col:'#3f7f6a',rev:true,v:b=>b.v.lbmk,f:v=>v==null?'—':`${v} · ${LBK(v)}`,de:'Lebensqualität',en:'Liveability',nl:'Leefbaarheid',def:()=>T('Leefbaarometer 2024 des Ministeriums BZK: Modell aus über 100 Merkmalen zu Wohnungen, Umgebung, Versorgung, Zusammenleben und Sicherheit — Klasse 1 (sehr ungenügend) bis 9 (ausgezeichnet). Dunkler = schwächer.','Leefbaarometer 2024 by the Ministry BZK: a model of over 100 features on housing, surroundings, amenities, social cohesion and safety — class 1 (very insufficient) to 9 (excellent). Darker = weaker.','Leefbaarometer 2024 van BZK: model uit ruim 100 kenmerken over woningen, omgeving, voorzieningen, samenleven en veiligheid — klasse 1 (zeer onvoldoende) tot 9 (uitstekend). Donkerder = zwakker.')},
 {id:'baenke',g:'wandel',col:'#8a6a3a',v:b=>b.v.baenke1000,f:v=>nf(v,1),de:'Bänke je 1.000 Einw.',en:'Benches per 1,000',nl:'Banken per 1.000',def:()=>T('öffentliche Bänke laut Register der Gemeente je 1.000 Einwohner','public benches from the municipal register per 1,000 residents','openbare banken uit het gemeenteregister per 1.000 inwoners')},
 {id:'solar',g:'wandel',col:'#c49a2b',v:b=>b.v.solar,f:v=>nf(v,0)+' %',de:'Solarstrom',en:'Solar power',nl:'Zonnestroom',def:()=>T('Wohnungen mit Solaranlage (CBS)','homes with solar panels (CBS)','woningen met zonnepanelen (CBS)')},
 {id:'bau',g:'wandel',col:'#17151c',v:b=>b.bau?b.bau[0]+b.bau[1]:null,f:v=>fmt(v),de:'Baustellen & Genehmigungen',en:'Construction & permits',nl:'Bouw & vergunningen',def:()=>T('Gebäude mit Status „Bau begonnen" oder „Baugenehmigung erteilt" im amtlichen Gebäuderegister (BAG)','buildings with status "construction started" or "permit granted" in the national building register (BAG)','panden met status „bouw gestart" of „bouwvergunning verleend" in de BAG')},
];
const LBK=k=>k==null?'—':T(...[['sehr ungenügend','very insufficient','zeer onvoldoende'],['deutlich ungenügend','highly insufficient','ruim onvoldoende'],['ungenügend','insufficient','onvoldoende'],['schwach','weak','zwak'],['ausreichend','sufficient','voldoende'],['mehr als ausreichend','more than sufficient','ruim voldoende'],['gut','good','goed'],['sehr gut','very good','zeer goed'],['ausgezeichnet','excellent','uitstekend']][k-1]);
const LBD={fys:['Umgebung','surroundings','fysieke omgeving'],onv:['Belästigung und Unsicherheit','nuisance and insecurity','overlast en onveiligheid'],soc:['Zusammenhalt','social cohesion','sociale samenhang'],vrz:['Versorgung','amenities','voorzieningen'],won:['Wohnungen','housing','woningvoorraad']};
const GROUPS=[['risiko',()=>T('Risiken','Risks','Risico\'s')],['menschen',()=>T('Menschen','People','Mensen')],['wandel',()=>T('Wandel','Change','Verandering')]];
const tname=t=>T(t.de,t.en,t.nl);
const ALL=()=>[...RISKS.map(r=>({...r,g:'risiko'})),...MORE];
let BU=null,MU=[],KN=null,map,buLayer=null,selLayer=null,theme=STORE.get('nx_theme_r')||'alle',sel=null,sevFilter=null;
let PTS={on:STORE.get('nx_pts')!=='0',trees:null,furn:null,bouw:null,cv:null};

// ── Kennzahlen je Quartier ──
const over=b=>RISKS.filter(r=>{const v=r.v(b);return v!=null&&r.over(v);});
// Klimabelastung 0–100: je örtlichem Risiko bis 25 Punkte — 0 bei eingehaltenem Richtwert, voll bei deutlicher Überschreitung.
// Überflutung zählt nicht mit: fast ganz Utrecht liegt in derselben LIWO-Klasse (Stadt-, kein Quartiersunterschied).
const cl01=x=>Math.max(0,Math.min(1,x));
const parts=b=>RISKS.filter(r=>r.pt).map(r=>{const v=r.v(b);return {r,v,p:v==null?null:25*cl01(r.pt(v))};});
const score=b=>{const a=parts(b).filter(x=>x.p!=null);return a.length>=3?a.reduce((s,x)=>s+x.p,0)*4/a.length:null;};
const GR=[[15,'A',['gering','low','laag'],['geringe Klimabelastung','low climate burden','lage klimaatbelasting']],[30,'B',['mäßig','moderate','matig'],['mäßige Klimabelastung','moderate climate burden','matige klimaatbelasting']],[45,'C',['erhöht','elevated','verhoogd'],['erhöhte Klimabelastung','elevated climate burden','verhoogde klimaatbelasting']],[60,'D',['hoch','high','hoog'],['hohe Klimabelastung','high climate burden','hoge klimaatbelasting']],[101,'E',['sehr hoch','very high','zeer hoog'],['sehr hohe Klimabelastung','very high climate burden','zeer hoge klimaatbelasting']]];
const grade=s=>s==null?null:GR.findIndex(g=>s<g[0]);
const gname=i=>T(...GR[i][2]);
const scol=s=>{const t=cl01(s/75)*5,i=Math.min(4,Math.floor(t));return rgb(mix(hex(SEV[i]),hex(SEV[i+1]),t-i));};
const gcol=i=>scol([7.5,22.5,37.5,52.5,67.5][i]);
const sev=score;
function people(b){
  const v=b.v,inw=v.inw||0,erw=inw*(1-((v.kinder||0)+.3*(v.jung||0))/100);   // Erwachsene ≈ Einwohner ohne Kinder und jüngste Jugendliche
  return {inw,erw,ue65:v.senioren!=null?inw*v.senioren/100:null,ue80:v.ue80!=null?inw*v.ue80/100:null,kinder:v.kinder!=null?inw*v.kinder/100:null,
    belaestigt:v.laermhinder!=null?erw*v.laermhinder/100:null,schlaf:v.schlaf!=null?erw*v.schlaf/100:null,einsam:v.einsam!=null?erw*v.einsam/100:null};
}
function ranks(){for(const t of ALL()){const vals=BU.map(b=>t.v(b)).filter(v=>v!=null).sort((a,b)=>a-b);
  for(const b of BU){b.r=b.r||{};const v=t.v(b);if(v==null||vals.length<2){b.r[t.id]=null;continue;}let lo=0,hi=0;for(const x of vals){if(x<v)lo++;if(x<=v)hi++;}b.r[t.id]=((lo+hi)/2-.5)/(vals.length-1);}}}
function fillOf(b){
  if(theme==='alle'){const s=score(b);return s==null?null:scol(s);}
  const t=ALL().find(x=>x.id===theme),v=t&&t.v(b);if(v==null)return null;
  if(t.over){const bad=t.over(v),span=Math.max(.1,t.inv?t.limv-t.min:t.max-t.limv),d=Math.min(1,Math.abs(v-t.limv)/span);return bad?tint(t.col,.55+.45*d):tint(t.col,.14+.25*(1-d));}
  const rk=b.r[t.id]||0;return tint(t.col,.1+.9*(t.rev?1-rk:rk));
}
const shown=b=>sevFilter==null||theme!=='alle'||grade(score(b))===sevFilter;

// ── Karte ──
map=L.map('map',{zoomControl:false,zoomSnap:.25,zoomDelta:.5,preferCanvas:true,minZoom:11}).setView([52.0907,5.1214],MOBILE()?12.25:13);
L.control.zoom({position:'bottomright'}).addTo(map);
const BASE={map:L.tileLayer('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© <a href="https://www.pdok.nl" target="_blank" rel="noopener">Kadaster / PDOK</a> · CBS · RIVM · GGD · LIWO · Gemeente Utrecht'}).addTo(map)};
const BASE_MAKE={photo:()=>L.tileLayer('https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg',{maxZoom:21,maxNativeZoom:21,attribution:'Luchtfoto © Beeldmateriaal Nederland / PDOK (CC BY 4.0)'}),
  osm:()=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende'})};
let baseKey='map';
function setBase(k){if(k===baseKey)return;map.removeLayer(BASE[baseKey]);BASE[k]=BASE[k]||BASE_MAKE[k]();BASE[k].addTo(map);BASE[k].bringToBack();baseKey=k;document.body.dataset.base=k;}
const rend=L.canvas({padding:.3,tolerance:2}),svgR=L.svg({padding:.5});
const ll=g=>g.map(p=>p.map(r=>r.map(([x,y])=>[y,x])));
const opa=()=>map.getZoom()>=15?.25:map.getZoom()>=14?.45:.7;
function styleOf(b){const f=fillOf(b),on=shown(b);
  return {fillColor:f||'#9b96a3',fillOpacity:f?(on?opa():.05):.1,color:isDark()?'#f3efe7':'#17151c',opacity:on?.55:.12,weight:b===sel?0:.8,dashArray:f?null:'3 3'};}
function drawBuurten(){
  if(buLayer)map.removeLayer(buLayer);buLayer=L.layerGroup();
  for(const b of BU){const m=L.polygon(ll(b.geom),{renderer:rend,...styleOf(b)});
    m.on('click',()=>openBuurt(b));m.on('mouseover',e=>hover(b,e.originalEvent));m.on('mousemove',e=>moveHov(e.originalEvent));m.on('mouseout',()=>hover(null));
    b._m=m;buLayer.addLayer(m);}
  buLayer.addTo(map);
}
function restyle(){BU.forEach(b=>b._m&&b._m.setStyle(styleOf(b)));}
map.on('zoomend',()=>{if(BU)restyle();drawPts();});
const center=b=>L.latLngBounds(ll(b.geom).flat(2)).getCenter();

// ── Bäume, Bänke, Baustellen als Punkte (ab Zoom 15) ──
function loadPts(){
  if(!PTS.trees)PTS.trees=fetch('data/official/trees_utr.json').then(r=>r.json()).then(j=>{const Y=new Date().getFullYear();return j.t.map(t=>[t[0],t[1],Math.min(6,(1+0.35*((t[2]>1800&&t[2]<=Y)?Y-t[2]:25))/2)]);}).catch(()=>[]);
  if(!PTS.furn)PTS.furn=fetch('data/official/furniture_utr.json').then(r=>r.json()).catch(()=>null);
  if(!PTS.bouw)PTS.bouw=fetch('data/official/bouw_utr.json').then(r=>r.ok?r.json():null).catch(()=>null);
  return Promise.all([PTS.trees,PTS.furn,PTS.bouw]);
}
function drawPts(){
  if(!PTS.cv){PTS.cv=document.createElement('canvas');PTS.cv.className='pts-canvas';map.getContainer().appendChild(PTS.cv);}
  const c=PTS.cv,sz=map.getSize(),dpr=Math.min(2,devicePixelRatio||1),g=c.getContext('2d');
  if(c.width!==Math.round(sz.x*dpr)||c.height!==Math.round(sz.y*dpr)){c.width=Math.round(sz.x*dpr);c.height=Math.round(sz.y*dpr);c.style.width=sz.x+'px';c.style.height=sz.y+'px';}
  if(!g||typeof g.clearRect!=='function')return;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);
  const on=PTS.on&&map.getZoom()>=15&&!(window.LAB&&LAB.on);document.body.classList.toggle('pts-on',on);if(!on)return;
  loadPts().then(([trees,furn,bouw])=>{if(!PTS.on||map.getZoom()<15||(window.LAB&&LAB.on))return;

function buurtAt(lat,lon){
  const inR=(x,y,r)=>{let ins=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const [xi,yi]=r[i],[xj,yj]=r[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;};
  return BU&&BU.find(b=>b.geom.some(p=>inR(lon,lat,p[0])&&!p.slice(1).some(h=>inR(lon,lat,h))))||null;
}

let SHEET='half';
const SNAP={peek:()=>innerHeight*.92-200,half:()=>innerHeight*.92*.42,full:()=>0};
function sheet(s){SHEET=s;const P=document.getElementById('panel');if(!MOBILE()){P.style.transform='';return;}P.style.transform=P.classList.contains('on')?`translateY(${SNAP[s]()}px)`:'';}
(()=>{const P=document.getElementById('panel'),H=document.getElementById('ph');let y0=null,t0=0,base=0;
  const down=e=>{if(!MOBILE()||e.target.closest('.close'))return;y0=e.clientY;t0=performance.now();base=SNAP[SHEET]();P.classList.add('dragging');H.setPointerCapture(e.pointerId);};
  const move=e=>{if(y0==null)return;const y=Math.max(0,base+(e.clientY-y0));P.style.transform=`translateY(${y}px)`;};
  const up=e=>{if(y0==null)return;P.classList.remove('dragging');const dy=e.clientY-y0,v=dy/Math.max(1,performance.now()-t0),y=base+dy;y0=null;
    if(Math.abs(dy)<6){sheet(SHEET==='full'?'half':SHEET==='half'?'full':'half');return;}
    if(v>1.1||y>SNAP.peek()+80){if(SHEET==='peek'||y>innerHeight*.85){closePanel();P.style.transform='';return;}}
    const opts=['full','half','peek'].map(s=>({s,d:Math.abs(SNAP[s]()-y)})).sort((a,b)=>a.d-b.d);sheet(v<-1.1?'full':v>1.1?(SHEET==='full'?'half':'peek'):opts[0].s);};
  H.addEventListener('pointerdown',down);H.addEventListener('pointermove',move);H.addEventListener('pointerup',up);H.addEventListener('pointercancel',up);
  addEventListener('resize',()=>sheet(SHEET));})();

function search(){
  const s=q.value.trim();if(s.length<2||!BU){sg.classList.remove('on');return;}
  const loc=BU.filter(b=>b.name.toLowerCase().includes(s.toLowerCase())).slice(0,5).map(b=>({label:b.name,kind:T('Quartier','Buurt','Buurt'),ic:I.area,go:()=>openBuurt(b)}));
  show(loc);
  if(qAbort)qAbort.abort();qAbort=new AbortController();
  fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${encodeURIComponent(s)}&fq=gemeentenaam:Utrecht&fq=type:adres&rows=5&fl=weergavenaam,centroide_ll,type`,{signal:qAbort.signal})
    .then(r=>r.json()).then(j=>{const docs=(j.response&&j.response.docs)||[];
      show(loc.concat(docs.map(d=>{const m=/POINT\(([\d.]+) ([\d.]+)\)/.exec(d.centroide_ll||'');return m?{label:d.weergavenaam.replace(/, Utrecht$| Utrecht$/,''),kind:T('Adresse','Address','Adres'),ic:I.pin,go:()=>{const lat=+m[2],lon=+m[1],b=buurtAt(lat,lon);if(b)openBuurt(b,false);map.flyTo([lat,lon],16,{duration:REDUCED?0:.9});}}:null;}).filter(Boolean)).slice(0,8));
    }).catch(()=>{});
}
function show(items){
  if(!items.length){sg.classList.remove('on');return;}
  sg.innerHTML=items.map((it,i)=>`<button data-i="${i}" role="option"><i>${it.ic}</i>${it.label}<small>${it.kind}</small></button>`).join('');
  sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{items[+b.dataset.i].go();sg.classList.remove('on');q.blur();});
  sg.classList.add('on');
}

  d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');const h3=d.querySelector('h3');if(h3){h3.id='hintT';d.setAttribute('aria-labelledby','hintT');}
  document.body.appendChild(d);
  d.addEventListener('pointerdown',e=>{if(e.target===d)hideHint();});   // HIG: Modales immer mit klarem Ausweg — Escape, daneben tippen, Knopf
  d.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();hideHint();}});
  setTimeout(()=>{const b=document.getElementById('hintOk');if(b)b.focus();},0);
  document.getElementById('hintOk').onclick=hideHint;
  document.getElementById('hintLab').onclick=()=>{hideHint();openLab([52.0907,5.1214]);};
}

applyLang();

  ranks();{const a=BU.map(score).filter(v=>v!=null).sort((x,y)=>x-y);BU._med=a.length?a[a.length>>1]:null;}
  const QS=new URLSearchParams(location.search),labQ=QS.get('lab'),at=QS.get('at'),bq=QS.get('b');

  else if(at){const [la,lo]=at.split(',').map(Number),b=buurtAt(la,lo);if(b){map.setView([la,lo],14,{animate:false});openBuurt(b,false);}}

  syncView();drawPts();
}).catch(()=>{document.getElementById('ldTxt').textContent=T('Daten konnten nicht geladen werden.','Data could not be loaded.','Data kon niet worden geladen.');});
